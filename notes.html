<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f0e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/memory.css?v=memory-v1-reset-20260904-2218">
<style>
.notes-editor{height:100dvh;width:100%;max-width:520px;margin:auto;overflow:hidden;background:var(--paper)}
.notes-editor-scroll{height:calc(100% - 68px - env(safe-area-inset-top));overflow:auto;padding:30px 15px 28px}
.editor-kicker{display:flex;align-items:center;justify-content:center;gap:7px;margin:2px 0 18px;font-family:"Nunito",system-ui,sans-serif;font-size:8px;color:#9a8e87;letter-spacing:.09em}.editor-kicker i{width:4px;height:4px;border-radius:50%;background:var(--pink)}
.editor-shell{padding:18px 16px;border:1px solid rgba(104,83,75,.06);border-radius:20px 7px 20px 20px;background:rgba(255,253,249,.72)}
.editor-shell h2{margin:6px 0 8px;font-size:16px}.editor-shell p{margin:0;font-size:10px;line-height:1.75;color:#8d817a}.editor-tags{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.editor-tags span{padding:5px 8px;border-radius:999px;background:rgba(239,222,218,.58);font-family:"Nunito",system-ui,sans-serif;font-size:7px;color:#9b757d}
</style>
<title>潮生 · Notes</title>
</head>
<body>
<main class="notes-editor">
  <header class="memory-topbar">
    <button class="back-btn" type="button" onclick="location.href='memory.html'" aria-label="返回 Memory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </button>
    <div class="memory-heading">
      <div class="memory-title">Notes</div>
      <div class="memory-subtitle">小记 · edit room</div>
    </div>
    <span></span>
  </header>
  <section class="notes-editor-scroll">
    <div class="editor-kicker"><span>TODAY · 03</span><i></i><span>waiting</span></div>
    <article class="editor-shell">
      <div class="eyebrow">NOTE EDITOR</div>
      <h2>今天的小记</h2>
      <p>这里就是之后真正编辑小记的页面。修改、删除、补充、tag 和 weight 都会放在这里；下一步我们再单独把这个页面做完整。</p>
      <div class="editor-tags"><span>edit</span><span>tag</span><span>weight</span></div>
    </article>
  </section>
</main>
</body>
</html>
