<head>

<title>潮生 · Studio</title>
<style>
:root{--paper:#f5f0e6;--paper2:#f8f3ea;--ink:#4f4743;--soft:#9a8e87;--skin:#efdeda;--milk:#f6e9e6;--bean:#dce3d2;--beanDeep:#8fa07a;--line:rgba(91,76,67,.075);--rose:#bf8794;--rosebg:#f3e1e6;--blue:#93a9ba;--bluebg:#e7edf2;--lemon:#c8b67a;--lemonbg:#f3eed8;--sagebg:#e8efe4;--chrome:color-mix(in srgb,var(--milk) 72%,var(--paper2))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}body{overflow:hidden;background:#ebe5dc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}button,textarea,input,select{font:inherit;color:inherit}button{border:0}.app{position:relative;overflow:hidden;height:100dvh;width:100%;max-width:520px;margin:auto;display:grid;grid-template-rows:auto auto 1fr;background:radial-gradient(circle at 87% 7%,rgba(239,222,218,.34),transparent 27%),radial-gradient(circle at 8% 72%,rgba(220,227,210,.24),transparent 24%),var(--paper)}
.topbar{position:relative;padding:calc(env(safe-area-inset-top) + 8px) 16px 14px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;background:var(--chrome);z-index:20}.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:15px;background:radial-gradient(circle at 15px 0,var(--chrome) 14px,transparent 14.5px) 0 0/30px 15px repeat-x;pointer-events:none}.topbar>.back,.topbar>.heading,.topbar>.star-wrap{position:relative;top:5px}.back,.star-btn{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center}.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.heading{text-align:center}.heading strong{display:block;font-size:16px;font-weight:650;letter-spacing:.035em}.heading small{display:block;margin-top:4px;color:#8f867e;font-size:10px}.star-wrap{justify-self:end}.star-btn{position:relative;color:#c48695;transition:color .28s ease,transform .2s ease}.star-btn:active{transform:scale(.94)}.star-btn.open{color:#8498a8}.star-morph{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;overflow:visible}.orbit-dot{position:absolute;width:5px;height:5px;border-radius:50%;border:1px solid #fff;transition:transform .28s ease}.orbit-dot.a{background:#c98d9a;right:2px;top:4px}.orbit-dot.b{background:#95aabd;left:3px;bottom:3px}.orbit-dot.c{background:#c7b675;right:2px;bottom:2px}.star-btn.open .orbit-dot.a{transform:translate(2px,-2px)}.star-btn.open .orbit-dot.b{transform:translate(-2px,2px)}.star-btn.open .orbit-dot.c{transform:translate(2px,2px)}
.tabs{height:58px;padding:15px 16px 5px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:linear-gradient(to bottom,rgba(245,240,230,.96),rgba(245,240,230,.72));z-index:10}.tab{height:38px;border-radius:15px;background:rgba(248,243,234,.82);font-size:11px;color:#8e837c}.tab.active{background:rgba(239,222,218,.70);color:#7b666b}.view{display:none;min-height:0}.view.active{display:block}
#workView{overflow:auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 24px)}.work-top{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 13px}.work-title strong{font-size:18px}.work-title small{display:block;margin-top:4px;font-size:8px;color:var(--soft)}.add-task{height:35px;padding:0 12px;border-radius:13px 5px 13px 13px;background:rgba(239,222,218,.72);font-size:9px;color:#86666f}.board{display:grid;grid-template-columns:1fr 1fr;gap:9px}.lane{position:relative;min-height:178px;padding:12px 9px 9px;border:1px solid rgba(104,85,77,.055);background:rgba(255,253,249,.72);box-shadow:0 8px 26px rgba(80,58,49,.04)}.lane.now{border-radius:6px 18px 8px 18px;transform:rotate(-.22deg)}.lane.next{border-radius:18px 6px 18px 8px;transform:rotate(.22deg)}.lane::before{content:"";position:absolute;top:-5px;left:50%;width:42px;height:10px;transform:translateX(-50%) rotate(-2deg);background:rgba(228,207,196,.34)}.lane.next::before{transform:translateX(-50%) rotate(2deg);background:rgba(213,220,225,.4)}.lane-head{display:flex;gap:6px;margin:1px 1px 9px}.lane-head b{font:600 8px Georgia,serif;letter-spacing:.1em}.lane-head span{font-size:6px;color:#a99c96}.task-stack{display:flex;flex-direction:column;gap:7px}.task-note{position:relative;width:100%;padding:10px 9px;text-align:left;border:1px solid rgba(112,89,80,.05);border-radius:11px 4px 11px 11px;background:rgba(255,252,248,.88)}.task-note::before{content:"";position:absolute;left:9px;top:0;width:28px;height:3px;background:#ddd}.task-note.owner-sheng::before{background:#e4bcc5}.task-note.owner-roche::before{background:#c4d1dc}.task-note.owner-lemoni::before{background:#e2d7a9}.task-note.owner-me::before{background:#c8d8c4}.task-note strong{display:block;font-size:9px;line-height:1.45;padding-right:20px}.task-note small{display:block;margin-top:6px;font-size:6px;color:#a2958f}.tiny-check{position:absolute;right:7px;top:7px;width:19px;height:19px;border-radius:7px 3px 7px 7px;background:#f2ece7;display:grid;place-items:center}.lane-empty{padding:20px 5px;text-align:center;color:#b0a39d;font:italic 6.5px Georgia,serif}.lane-add{width:100%;height:30px;margin-top:7px;border:1px dashed rgba(122,96,87,.085);border-radius:9px 3px 9px 9px;background:transparent;color:#a59690}.done-pocket{margin-top:11px}.done-toggle{width:100%;height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;border-radius:13px 5px 13px 13px;background:rgba(247,241,236,.7);font-size:8px}.done-toggle span:last-child{margin-left:auto}.done-list{display:none}.done-pocket.open .done-list{display:block}.done-cards{display:flex;flex-direction:column;gap:6px;padding-top:7px}.done-card{display:grid;grid-template-columns:23px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:11px 4px 11px 11px;background:rgba(255,252,248,.58);opacity:.72}.done-card strong{font-size:8.5px;text-decoration:line-through}.done-card small{font-size:6px;color:#a89b95}
#chatView.active{display:grid;grid-template-rows:auto auto 1fr auto;min-height:0;height:100%;overflow:hidden}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:9px 18px 8px}.chat-head strong{font-size:13px}.chat-head small{display:block;margin-top:4px;color:#9c9088;font-size:8px}.member-stack{display:flex;background:transparent}.mini-avatar{width:28px;height:28px;margin-left:-5px;border:2px solid var(--paper);border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:7px;font-weight:700}.mini-avatar:first-child{margin-left:0}.mini-avatar .avatar-img,.mini-avatar .avatar-mark{width:100%;height:100%;border-radius:50%}.sheng-bg{background:var(--rosebg);color:#936b75}.roche-bg{background:var(--bluebg);color:#738596}.lemoni-bg{background:var(--lemonbg);color:#887c50}.me-bg{background:var(--sagebg);color:#728672}.chat-paper{margin:0 18px 8px;padding:8px 10px;border-radius:12px 4px 12px 12px;background:rgba(249,243,238,.60);font-size:7px;color:#91847d}.messages{min-height:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:11px;padding:3px 18px 14px}.messages::-webkit-scrollbar{display:none}.msg{display:flex;gap:8px;align-items:flex-start;animation:msgIn .28s cubic-bezier(.2,.82,.2,1)}@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.msg.me{justify-content:flex-end}.msg-avatar{width:29px;height:29px;flex:0 0 29px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:6px;font-weight:700}.msg-wrap{max-width:79%}.who{display:block;margin:0 0 4px 3px;font-size:6px;color:#a39791}.bubble{padding:10px 11px;border-radius:5px 14px 14px 14px;background:rgba(255,252,248,.84);font-size:9px;line-height:1.65}.msg.sheng .bubble{background:rgba(245,230,234,.79)}.msg.roche .bubble{background:rgba(232,238,243,.84)}.msg.lemoni .bubble{background:rgba(244,240,221,.86)}.msg.me .bubble{border-radius:14px 5px 14px 14px;background:rgba(231,239,229,.89)}.time{margin:4px 3px 0;font-size:5.5px;color:#b3a7a1}.msg.me .who,.msg.me .time{text-align:right}.image-msg{max-width:210px;border-radius:11px 4px 11px 11px;display:block}.file-msg{display:flex;align-items:center;gap:8px;min-width:188px}.file-icon{width:34px;height:34px;border-radius:10px 4px 10px 10px;background:rgba(255,255,255,.46);display:grid;place-items:center}.file-copy strong{display:block;font-size:8px}.file-copy small{display:block;margin-top:3px;font-size:6px;color:#91847e}.sticker-msg{font-size:30px;line-height:1}.voice-msg{display:flex;align-items:center;gap:8px;min-width:132px}.voice-wave{letter-spacing:2px;color:#789080}.voice-time{font-size:7px;color:#857973}
.composer-wrap{position:relative;background:var(--chrome);border-top:1px solid rgba(91,76,67,.055);border-radius:24px 24px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 7px);z-index:15}.input-layer{min-height:47px;padding:0 4px 4px}.input-layer textarea{width:100%;min-height:42px;max-height:118px;resize:none;border:0;outline:0;background:transparent;padding:9px 2px 8px;color:var(--ink);font-size:15px;line-height:1.5}.input-layer textarea::placeholder{color:#b1a59e}.action-layer{height:46px;display:grid;grid-template-columns:42px auto 1fr 42px 42px;align-items:center;gap:8px;border-top:1px solid rgba(91,76,67,.045);padding-top:5px}.action{height:38px;border:0;background:transparent;display:grid;place-items:center;color:#6f6761}.action.more{width:38px}.action.mention-btn{justify-self:start;display:flex;align-items:center;gap:6px;padding:0 11px 0 12px;border-radius:15px;background:rgba(239,222,218,.62);font-size:12px;color:#756a65;white-space:nowrap}.action.spacer{min-width:0}.action svg,.quick-icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.action.more svg{width:22px;height:22px;stroke-width:1.75}.action.send{width:40px;height:40px;border-radius:50%;background:var(--bean);color:#58604d}.action.send:active,.action.mic:active,.action.more:active{transform:scale(.94)}.more-popover,.mention-popover,.sticker-popover{position:absolute;bottom:calc(100% + 9px);border:1px solid rgba(100,82,72,.075);background:color-mix(in srgb,var(--paper2) 93%,transparent);box-shadow:0 14px 38px rgba(69,55,47,.10);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;transition:opacity .17s ease,transform .2s cubic-bezier(.2,.8,.2,1)}.more-popover.open,.mention-popover.open,.sticker-popover.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.more-popover{left:12px;width:214px;padding:9px;border-radius:18px}.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.more-item{height:62px;border-radius:13px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6d635d}.more-item:nth-child(1){background:rgba(246,233,230,.34)}.more-item:nth-child(3){background:rgba(220,227,210,.30)}.more-item span{font-size:10.5px}.more-item .quick-icon{width:19px;height:19px;stroke-width:1.65}.mention-popover{left:58px;width:180px;padding:8px;border-radius:18px}.mention-choice{width:100%;height:40px;border-radius:12px;background:transparent;text-align:left;padding:0 10px;font-size:11px}.mention-choice:nth-child(odd){background:rgba(246,233,230,.30)}.sticker-popover{left:12px;width:224px;padding:9px;border-radius:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.sticker{height:44px;border-radius:11px;background:rgba(246,233,230,.38);font-size:21px}.action.mic.recording{color:#b66f7f;animation:pulse 1s ease infinite}@keyframes pulse{50%{transform:scale(.9)}}
.toolbox{position:fixed;z-index:80;top:calc(env(safe-area-inset-top) + 62px);left:50%;width:min(360px,calc(100vw - 28px));transform:translate(-50%,-10px) scale(.96);opacity:0;pointer-events:none;transition:.28s}.toolbox.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}.toolbox-card{padding:14px 13px 12px;border:1px solid rgba(111,87,79,.07);border-radius:21px 7px 21px 21px;background:rgba(255,250,247,.97);box-shadow:0 20px 55px rgba(65,50,44,.12);backdrop-filter:blur(15px)}.toolbox-head{display:flex;justify-content:space-between;margin:0 2px 10px}.toolbox-head strong{font-size:10px}.toolbox-head span{font:italic 6.5px Georgia,serif;color:#ad9d96}.agent-peek{width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;padding:9px 8px;margin-top:6px;text-align:left;border:1px solid rgba(113,90,82,.05);border-radius:13px 5px 13px 13px;background:rgba(250,244,239,.68)}.avatar-img,.avatar-mark{width:38px;height:38px;border-radius:13px 5px 13px 13px;object-fit:cover;display:grid;place-items:center;font-size:8px;font-weight:700}.agent-peek strong{display:block;font-size:9.5px}.agent-peek small{display:block;margin-top:4px;font-size:6px;color:#a0938d}.state-pill{display:flex;align-items:center;gap:5px;font-size:6px;color:#8f827c}.state-pill i{width:6px;height:6px;border-radius:50%;background:#b9b1ac}.state-pill.online i{background:#97ad98}.state-pill.busy i{background:#c88d99}.state-pill.idle i{background:#c8b77b}.api-chip{margin-top:7px;width:100%;height:31px;border-radius:10px 4px 10px 10px;background:rgba(244,239,219,.7);font-size:7px;color:#8c8058}
dialog{width:calc(100% - 30px);max-width:470px;border:1px solid rgba(105,85,77,.07);border-radius:21px 7px 21px 21px;background:#fffaf6;padding:0}dialog::backdrop{background:rgba(68,57,52,.18);backdrop-filter:blur(8px)}.sheet{padding:16px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.close{width:31px;height:31px;border-radius:50%;background:#f1e6e2}.field-label{display:block;margin:10px 1px 4px;font-size:6.5px;color:#a1948d}.field{width:100%;height:41px;border:1px solid var(--line);background:#faf4ef;border-radius:12px 5px 12px 12px;padding:0 11px;font-size:10px}.sheet-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:11px}.sheet-actions button{height:34px;padding:0 12px;border-radius:10px 4px 10px 10px;background:#ead9de;color:#86656e;font-size:8px}.avatar-editor{display:flex;gap:11px;align-items:center}.avatar-preview{width:54px;height:54px;border-radius:17px 6px 17px 17px;overflow:hidden;display:grid;place-items:center}.avatar-preview img{width:100%;height:100%;object-fit:cover}.avatar-actions{display:flex;gap:7px}.avatar-actions label,.avatar-actions button{height:31px;padding:0 9px;border-radius:9px;background:#eee5df;font-size:7px;display:flex;align-items:center}.avatar-actions input{display:none}.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);z-index:110;transform:translate(-50%,-8px);padding:7px 11px;border-radius:10px;background:rgba(45,39,35,.84);color:white;font-size:10px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:370px){.board{gap:7px}.more-popover{left:8px}.mention-popover{left:52px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><button class="back" onclick="location.href='index.html'" aria-label="返回 Chat"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><div class="heading"><strong>Studio</strong><small>work & chat</small></div><div class="star-wrap"><button class="star-btn" id="toolboxBtn" aria-expanded="false" aria-label="成员与设置"><svg class="star-morph" viewBox="0 0 24 24"><path id="toolboxMorphPath" d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16.5 3.13a4 4 0 0 1 0 7.75"/></svg><i class="orbit-dot a"></i><i class="orbit-dot b"></i><i class="orbit-dot c"></i></button></div></header>
<div class="toolbox" id="toolbox"><section class="toolbox-card" onclick="event.stopPropagation()"><div class="toolbox-head"><strong>小盒子</strong><span>members</span></div><div id="agentPeekList"></div><button class="api-chip" id="geminiQuick">Lemoni · Gemini API</button></section></div>
<nav class="tabs"><button class="tab active" data-view="work">WORK</button><button class="tab" data-view="chat">CHAT</button></nav>
<section class="view active" id="workView"><div class="work-top"><div class="work-title"><strong>今天做什么</strong><small id="taskCount"></small></div><button class="add-task" id="addTask">＋ 放一张纸条</button></div><div class="board"><section class="lane now"><div class="lane-head"><b>NOW</b><span>正在做</span></div><div class="task-stack" id="nowList"></div><button class="lane-add" data-add-stage="now">＋</button></section><section class="lane next"><div class="lane-head"><b>NEXT</b><span>等一下</span></div><div class="task-stack" id="nextList"></div><button class="lane-add" data-add-stage="next">＋</button></section></div><section class="done-pocket" id="donePocket"><button class="done-toggle" id="doneToggle"><span>✓</span><span>收起来的完成项</span><span id="doneCount">0</span><span>⌄</span></button><div class="done-list"><div class="done-cards" id="doneList"></div></div></section></section>
<section class="view" id="chatView"><div class="chat-head"><div><strong>工作群</strong><small id="chatMembersText"></small></div><button class="member-stack" id="memberStack"></button></div><div class="chat-paper">♡ 今天也一起把事情做完。</div><div class="messages" id="messages"></div><footer class="composer-wrap" id="composerWrap"><div class="more-popover" id="morePopover"><div class="more-grid"><button class="more-item" data-action="camera"><svg class="quick-icon" viewBox="0 0 24 24"><path d="M7 7h2l1.4-2h3.2L15 7h2.5A2.5 2.5 0 0 1 20 9.5v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-7A2.5 2.5 0 0 1 6.5 7H7Z"/><circle cx="12" cy="13" r="3.2"/></svg><span>拍照</span></button><button class="more-item" data-action="image"><svg class="quick-icon" viewBox="0 0 24 24"><rect height="14" rx="2.5" width="16" x="4" y="5"/><circle cx="9" cy="10" r="1.5"/><path d="m6 17 4-4 3 3 2-2 3 3"/></svg><span>图片</span></button><button class="more-item" data-action="file"><svg class="quick-icon" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/></svg><span>附件</span></button><button class="more-item" data-action="sticker"><svg class="quick-icon" viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4v5l-5 5H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M13 18v-3a2 2 0 0 1 2-2h3"/><circle cx="9" cy="9" r=".8" fill="currentColor" stroke="none"/><circle cx="13" cy="9" r=".8" fill="currentColor" stroke="none"/><path d="M8.5 12c.8.7 1.7 1 2.5 1s1.7-.3 2.5-1"/></svg><span>表情包</span></button></div></div><div class="mention-popover" id="mentionPopover"></div><div class="sticker-popover" id="stickerPopover"></div><div class="input-layer"><textarea id="chatInput" placeholder="慢慢说…" rows="1"></textarea></div><div class="action-layer"><button class="action more" id="moreBtn" aria-label="更多"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="action mention-btn" id="mentionBtn">@ 成员</button><div class="action spacer"></div><button class="action mic" id="voiceBtn" aria-label="语音"><svg viewBox="0 0 24 24"><rect height="11" rx="3" width="6" x="9" y="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg></button><button class="action send" id="chatSend" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="imageInput" type="file" accept="image/*" hidden><input id="fileInput" type="file" hidden></footer></section>
</main>
<dialog id="taskDialog"><div class="sheet"><div class="sheet-head"><strong>纸条</strong><button class="close" data-close="task">×</button></div><label class="field-label">写什么</label><input class="field" id="taskTitle"><label class="field-label">交给谁</label><select class="field" id="taskOwner"></select><label class="field-label">放哪里</label><select class="field" id="taskStage"><option value="now">NOW</option><option value="next">NEXT</option><option value="done">DONE</option></select><div class="sheet-actions"><button id="saveTask">放好</button></div></div></dialog>
<dialog id="agentDialog"><div class="sheet"><div class="sheet-head"><strong>成员卡</strong><button class="close" data-close="agent">×</button></div><div class="avatar-editor"><div class="avatar-preview" id="avatarPreview"></div><div class="avatar-actions"><label>换头像<input type="file" id="avatarFile" accept="image/*"></label><button id="resetAvatar">恢复</button></div></div><label class="field-label">备注</label><input class="field" id="agentName"><label class="field-label">状态</label><select class="field" id="agentStatus"><option value="online">在线</option><option value="busy">忙碌</option><option value="idle">摸鱼</option><option value="offline">离线</option></select><div class="sheet-actions"><button id="saveAgent">保存</button></div></div></dialog>
<dialog id="apiDialog"><div class="sheet"><div class="sheet-head"><strong>Lemoni · API</strong><button class="close" data-close="api">×</button></div><label class="field-label">API Key</label><input class="field" id="geminiKey" type="password"><label class="field-label">Model ID</label><input class="field" id="geminiModel"><label class="field-label">Endpoint</label><input class="field" id="geminiEndpoint"><div class="sheet-actions"><button id="saveGemini">保存</button></div></div></dialog><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const A='chaosheng-studio-agents-v2',T='chaosheng-studio-tasks-v2',C='chaosheng-studio-chat-v2',G='chaosheng-studio-gemini-v1';const defaults={sheng:{name:'潮生',engine:'CC',status:'online',avatar:''},roche:{name:'Roche',engine:'Codex',status:'online',avatar:''},lemoni:{name:'Lemoni',engine:'Gemini',status:'offline',avatar:''}};let agents=Object.assign({},defaults,JSON.parse(localStorage.getItem(A)||'{}'));Object.keys(defaults).forEach(k=>agents[k]=Object.assign({},defaults[k],agents[k]||{}));let tasks=JSON.parse(localStorage.getItem(T)||'null')||[{id:'t1',title:'工作室页面',owner:'roche',stage:'now'},{id:'t2',title:'群聊联调',owner:'sheng',stage:'next'}];let chat=JSON.parse(localStorage.getItem(C)||'null')||[{who:'sheng',type:'text',text:'我在。',time:'16:31'},{who:'roche',type:'text',text:'嗯，先把这里改顺手。',time:'16:32'}];let gemini=Object.assign({model:'',endpoint:'https://generativelanguage.googleapis.com'},JSON.parse(localStorage.getItem(G)||'{}'));let currentTaskId=null,currentAgentKey=null,pendingAvatar='',recordStart=0;const marks={sheng:'潮',roche:'R',lemoni:'L',me:'漾'},bgs={sheng:'sheng-bg',roche:'roche-bg',lemoni:'lemoni-bg',me:'me-bg'};const save=()=>{localStorage.setItem(A,JSON.stringify(agents));localStorage.setItem(T,JSON.stringify(tasks));localStorage.setItem(C,JSON.stringify(chat));localStorage.setItem(G,JSON.stringify(gemini))},now=()=>new Date().toTimeString().slice(0,5);function toast(t){const e=$('.toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),1100)}function ownerName(k){return k==='me'?'小漾':agents[k]?.name||k}function statusText(s){return {online:'在线',busy:'忙碌',idle:'摸鱼',offline:'离线'}[s]}function avatar(k,cls='avatar-mark'){const a=k==='me'?{avatar:'',name:'小漾'}:agents[k],e=document.createElement(a.avatar?'img':'span');e.className=cls+' '+bgs[k];if(a.avatar){e.src=a.avatar;e.alt=a.name}else e.textContent=marks[k];return e}
function toolbox(open){$('#toolbox').classList.toggle('open',open);$('#toolboxBtn').classList.toggle('open',open);$('#toolboxBtn').setAttribute('aria-expanded',open?'true':'false');window.__setToolboxMorph?.(open)}$('#toolboxBtn').onclick=e=>{e.stopPropagation();toolbox(!$('#toolbox').classList.contains('open'))};$('#toolbox').onclick=e=>e.stopPropagation();document.addEventListener('click',()=>{toolbox(false);setMore(false);setMention(false)});$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view+'View').classList.add('active');toolbox(false);if(b.dataset.view==='chat')requestAnimationFrame(scrollChat)});
function renderToolbox(){const box=$('#agentPeekList');box.innerHTML='';['sheng','roche','lemoni'].forEach(k=>{const a=agents[k],btn=document.createElement('button');btn.className='agent-peek';btn.appendChild(avatar(k,a.avatar?'avatar-img':'avatar-mark'));const cp=document.createElement('span');cp.innerHTML='<strong></strong><small></small>';cp.querySelector('strong').textContent=a.name;cp.querySelector('small').textContent=a.engine;btn.appendChild(cp);const st=document.createElement('span');st.className='state-pill '+a.status;st.innerHTML='<i></i>'+statusText(a.status);btn.appendChild(st);btn.onclick=()=>openAgent(k);box.appendChild(btn)});renderMembers();renderTasks();renderChat();renderMentionChoices()}
function taskCard(t){const b=document.createElement('button');b.className='task-note owner-'+t.owner;b.innerHTML='<strong></strong><small></small><span class="tiny-check">○</span>';b.querySelector('strong').textContent=t.title;b.querySelector('small').textContent=ownerName(t.owner);b.onclick=()=>openTask(t.id);b.querySelector('.tiny-check').onclick=e=>{e.stopPropagation();t.stage='done';save();renderTasks()};return b}function renderTasks(){for(const id of ['nowList','nextList','doneList'])$('#'+id).innerHTML='';tasks.filter(t=>t.stage==='now').forEach(t=>$('#nowList').appendChild(taskCard(t)));tasks.filter(t=>t.stage==='next').forEach(t=>$('#nextList').appendChild(taskCard(t)));for(const id of ['nowList','nextList'])if(!$('#'+id).children.length)$('#'+id).innerHTML='<div class="lane-empty">空空的</div>';const done=tasks.filter(t=>t.stage==='done');done.forEach(t=>{const d=document.createElement('div');d.className='done-card';d.innerHTML='<span>✓</span><div><strong></strong><small></small></div><button>×</button>';d.querySelector('strong').textContent=t.title;d.querySelector('small').textContent=ownerName(t.owner);d.querySelector('button').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();renderTasks()};$('#doneList').appendChild(d)});$('#doneCount').textContent=done.length;$('#taskCount').textContent=tasks.filter(t=>t.stage!=='done').length+' 个待办'}function fillOwners(){taskOwner.innerHTML='<option value="me">小漾</option>'+['sheng','roche','lemoni'].map(k=>`<option value="${k}">${agents[k].name}</option>`).join('')}function openTask(id=null,stage='now'){currentTaskId=id;fillOwners();const t=tasks.find(x=>x.id===id);taskTitle.value=t?.title||'';taskOwner.value=t?.owner||'me';taskStage.value=t?.stage||stage;taskDialog.showModal()}addTask.onclick=()=>openTask();$$('[data-add-stage]').forEach(b=>b.onclick=()=>openTask(null,b.dataset.addStage));saveTask.onclick=()=>{const v=taskTitle.value.trim();if(!v)return;if(currentTaskId){const t=tasks.find(x=>x.id===currentTaskId);Object.assign(t,{title:v,owner:taskOwner.value,stage:taskStage.value})}else tasks.unshift({id:'t'+Date.now(),title:v,owner:taskOwner.value,stage:taskStage.value});save();renderTasks();taskDialog.close()};doneToggle.onclick=()=>donePocket.classList.toggle('open');
function renderMembers(){memberStack.innerHTML='';['me','sheng','roche','lemoni'].forEach(k=>{const w=document.createElement('span');w.className='mini-avatar';w.appendChild(avatar(k));memberStack.appendChild(w)});chatMembersText.textContent='小漾 · '+['sheng','roche','lemoni'].map(k=>agents[k].name).join(' · ')}memberStack.onclick=e=>{e.stopPropagation();toolbox(true)};function bubbleContent(w,m){const b=w.querySelector('.bubble');b.className='bubble';b.innerHTML='';if(m.type==='image'){const img=document.createElement('img');img.className='image-msg';img.src=m.data;b.appendChild(img)}else if(m.type==='file'){b.classList.add('file-msg');b.innerHTML='<span class="file-icon">⌑</span><span class="file-copy"><strong></strong><small></small></span>';b.querySelector('strong').textContent=m.name;b.querySelector('small').textContent=m.size||'附件'}else if(m.type==='sticker'){b.innerHTML='<div class="sticker-msg"></div>';b.firstChild.textContent=m.text}else if(m.type==='voice'){b.innerHTML='<div class="voice-msg"><span class="voice-wave">▮▯▮▮▯▮</span><span class="voice-time"></span></div>';b.querySelector('.voice-time').textContent=(m.seconds||1)+'″'}else b.textContent=m.text||''}function renderChat(){messages.innerHTML='';chat.forEach(m=>{const e=document.createElement('article');e.className='msg '+(m.who==='me'?'me':m.who);if(m.who!=='me')e.appendChild(avatar(m.who,'msg-avatar'));const w=document.createElement('div');w.className='msg-wrap';w.innerHTML='<span class="who"></span><div class="bubble"></div><div class="time"></div>';w.querySelector('.who').textContent=m.who==='me'?'小漾':agents[m.who]?.name||m.who;w.querySelector('.time').textContent=m.time||'';bubbleContent(w,m);e.appendChild(w);messages.appendChild(e)})}function scrollChat(){messages.scrollTop=messages.scrollHeight}function pushMessage(m){chat.push(Object.assign({who:'me',time:now()},m));save();renderChat();requestAnimationFrame(scrollChat)}function resizeInput(){chatInput.style.height='auto';chatInput.style.height=Math.min(chatInput.scrollHeight,118)+'px'}chatInput.oninput=resizeInput;function sendText(){const v=chatInput.value.trim();if(!v)return;pushMessage({type:'text',text:v});chatInput.value='';resizeInput()}chatSend.onclick=sendText;chatInput.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};
function closeFloaters(){setMore(false);setMention(false);stickerPopover.classList.remove('open')}function setMore(open){morePopover.classList.toggle('open',open);if(open){setMention(false);stickerPopover.classList.remove('open')}}function setMention(open){mentionPopover.classList.toggle('open',open);if(open){setMore(false);stickerPopover.classList.remove('open')}}moreBtn.onclick=e=>{e.stopPropagation();setMore(!morePopover.classList.contains('open'))};mentionBtn.onclick=e=>{e.stopPropagation();setMention(!mentionPopover.classList.contains('open'))};composerWrap.onclick=e=>e.stopPropagation();morePopover.onclick=e=>e.stopPropagation();mentionPopover.onclick=e=>e.stopPropagation();stickerPopover.onclick=e=>e.stopPropagation();function renderMentionChoices(){mentionPopover.innerHTML='';[['sheng',agents.sheng.name],['roche',agents.roche.name],['lemoni',agents.lemoni.name],['all','全员']].forEach(([k,n])=>{const b=document.createElement('button');b.className='mention-choice';b.textContent='@'+n;b.onclick=()=>{chatInput.value+=(chatInput.value?' ':'')+'@'+n+' ';chatInput.focus();setMention(false)};mentionPopover.appendChild(b)})}
$$('.more-item').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='camera')cameraInput.click();if(a==='image')imageInput.click();if(a==='file')fileInput.click();if(a==='sticker'){setMore(false);stickerPopover.classList.toggle('open')}});const stickers=['🥺','QAQ','ouo','♡','🐑','🍋','૮ ˶ᵔ ᵕ ᵔ˶ ა','(๑•̀ㅂ•́)و✧'];stickers.forEach(s=>{const b=document.createElement('button');b.className='sticker';b.textContent=s;b.onclick=()=>{pushMessage({type:'sticker',text:s});stickerPopover.classList.remove('open')};stickerPopover.appendChild(b)});function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}async function sendImage(input){const f=input.files?.[0];if(!f)return;const data=await readFile(f);pushMessage({type:'image',data});input.value='';closeFloaters()}cameraInput.onchange=()=>sendImage(cameraInput);imageInput.onchange=()=>sendImage(imageInput);fileInput.onchange=()=>{const f=fileInput.files?.[0];if(!f)return;pushMessage({type:'file',name:f.name,size:f.size<1024?f.size+' B':(f.size/1024).toFixed(1)+' KB'});fileInput.value='';closeFloaters()};voiceBtn.onclick=()=>{if(!recordStart){recordStart=Date.now();voiceBtn.classList.add('recording');toast('正在录音 · 再点一次发送')}else{const seconds=Math.max(1,Math.round((Date.now()-recordStart)/1000));recordStart=0;voiceBtn.classList.remove('recording');pushMessage({type:'voice',seconds})}};
function openAgent(k){currentAgentKey=k;pendingAvatar=agents[k].avatar||'';agentName.value=agents[k].name;agentStatus.value=agents[k].status;renderAvatar();toolbox(false);agentDialog.showModal()}function renderAvatar(){avatarPreview.innerHTML='';avatarPreview.appendChild(pendingAvatar?Object.assign(document.createElement('img'),{src:pendingAvatar}):avatar(currentAgentKey))}avatarFile.onchange=async()=>{const f=avatarFile.files?.[0];if(f)pendingAvatar=await readFile(f);renderAvatar()};resetAvatar.onclick=()=>{pendingAvatar='';renderAvatar()};saveAgent.onclick=()=>{agents[currentAgentKey].name=agentName.value.trim()||agents[currentAgentKey].name;agents[currentAgentKey].status=agentStatus.value;agents[currentAgentKey].avatar=pendingAvatar;save();agentDialog.close();renderToolbox()};geminiQuick.onclick=()=>{toolbox(false);geminiKey.value=sessionStorage.getItem('chaosheng-gemini-key-preview')||'';geminiModel.value=gemini.model;geminiEndpoint.value=gemini.endpoint;apiDialog.showModal()};saveGemini.onclick=()=>{gemini.model=geminiModel.value.trim();gemini.endpoint=geminiEndpoint.value.trim();sessionStorage.setItem('chaosheng-gemini-key-preview',geminiKey.value.trim());save();apiDialog.close();toast('收好了')};$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close+'Dialog').close());renderToolbox();
(async()=>{try{const [{createMorph},{Users,Settings}]=await Promise.all([import('https://esm.sh/morphicons@1.5.0/dom'),import('https://esm.sh/lucide@1.28.0')]);const morph=createMorph(document.getElementById('toolboxMorphPath'),Users,{reducedMotion:'user'});window.__setToolboxMorph=open=>morph.morphTo(open?Settings:Users,'smooth')}catch(err){console.warn('Morphicons studio fallback:',err)}})();
</script>
