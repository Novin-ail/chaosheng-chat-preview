<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbf5f4">
<title>潮生 · Studio</title>
<style>
:root{
  --ink:#665954;--soft:#a08f89;--line:rgba(122,91,82,.085);--paper:rgba(255,252,248,.86);
  --rose:#bf8794;--rosebg:#f3e1e6;--sage:#9aad97;--sagebg:#e8efe4;
  --blue:#93a9ba;--bluebg:#e7edf2;--lemon:#c8b67a;--lemonbg:#f3eed8;
  --cream:#fbf5f1;--shadow:0 9px 28px rgba(83,60,51,.045)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#eee5e0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{border:0;cursor:pointer}input,textarea,select{outline:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid rgba(191,135,148,.38);outline-offset:3px}
.app{width:100%;max-width:520px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(rgba(255,249,247,.77),rgba(255,250,246,.79)),url('assets/dear-lamb-bg-v2.svg') center/cover}
.topbar{height:calc(62px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 15px 0;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;position:sticky;top:0;z-index:50;background:rgba(251,246,242,.75);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);border-bottom:1px solid rgba(107,86,78,.04)}
.back,.star-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,252,248,.72);display:grid;place-items:center;color:#7b6c66}
.back svg{width:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.heading{text-align:center}.heading strong{display:block;font-size:15px;font-weight:680;letter-spacing:.075em}.heading small{display:block;margin-top:5px;font:italic 7px Georgia,serif;letter-spacing:.11em;color:#a5948e}
.star-wrap{justify-self:end;position:relative}.star-btn{position:relative;font:19px Georgia,serif;color:#ae8792;transition:transform .55s cubic-bezier(.2,.84,.2,1),background .25s ease}.star-btn.open{transform:rotate(72deg) scale(1.03);background:rgba(242,226,231,.84)}
.orbit-dot{position:absolute;width:5px;height:5px;border-radius:50%;border:1px solid rgba(255,255,255,.75);transition:transform .4s ease}.orbit-dot.a{background:#c98d9a;right:1px;top:2px}.orbit-dot.b{background:#95aabd;left:1px;bottom:2px}.orbit-dot.c{background:#c7b675;right:1px;bottom:1px}.star-btn.open .orbit-dot.a{transform:translate(2px,-2px)}.star-btn.open .orbit-dot.b{transform:translate(-2px,2px)}.star-btn.open .orbit-dot.c{transform:translate(2px,2px)}
.tabs{position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:35;margin:0 15px;padding:9px 0 8px;display:grid;grid-template-columns:1fr 1fr;gap:7px;background:linear-gradient(to bottom,rgba(251,246,242,.98) 74%,rgba(251,246,242,0))}
.tab{height:38px;border-radius:13px 5px 13px 13px;background:rgba(255,252,248,.56);color:#9a8d87;font:600 8px/1 Georgia,serif;letter-spacing:.13em;transition:transform .2s ease,background .24s ease,color .24s ease}.tab:active{transform:scale(.97)}.tab.active{background:rgba(241,225,230,.81);color:#7f616a;box-shadow:inset 0 0 0 1px rgba(130,97,103,.04)}
.view{display:none;padding:4px 15px calc(env(safe-area-inset-bottom) + 24px)}.view.active{display:block}
.toolbox{position:fixed;z-index:80;top:calc(env(safe-area-inset-top) + 54px);left:50%;width:min(360px,calc(100vw - 28px));transform:translate(-50%,-10px) scale(.96);transform-origin:calc(100% - 24px) 0;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .45s cubic-bezier(.18,.92,.22,1)}
.toolbox.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.toolbox-card{position:relative;padding:14px 13px 12px;border:1px solid rgba(111,87,79,.07);border-radius:21px 7px 21px 21px;background:rgba(255,250,247,.96);box-shadow:0 20px 55px rgba(65,50,44,.12);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.toolbox-card::before{content:"";position:absolute;right:19px;top:-7px;width:16px;height:16px;background:rgba(255,250,247,.96);border-left:1px solid rgba(111,87,79,.07);border-top:1px solid rgba(111,87,79,.07);transform:rotate(45deg);border-radius:3px 0 0 0}
.toolbox-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.toolbox-head strong{font-size:10px;letter-spacing:.04em}.toolbox-head span{font:italic 6.5px Georgia,serif;color:#ad9d96}
.agent-peek{width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;padding:9px 8px;margin-top:6px;text-align:left;border:1px solid rgba(113,90,82,.05);border-radius:13px 5px 13px 13px;background:rgba(250,244,239,.68);transition:transform .2s ease,background .2s ease}.agent-peek:active{transform:scale(.985);background:rgba(247,238,234,.86)}
.avatar-img,.avatar-mark{width:38px;height:38px;border-radius:13px 5px 13px 13px;object-fit:cover;display:grid;place-items:center;font-size:8px;font-weight:700}.sheng-bg{background:var(--rosebg);color:#936b75}.roche-bg{background:var(--bluebg);color:#738596}.lemoni-bg{background:var(--lemonbg);color:#887c50}.me-bg{background:var(--sagebg);color:#728672}
.agent-peek strong{display:block;font-size:9.5px;font-weight:650}.agent-peek small{display:block;margin-top:4px;font-size:6px;color:#a0938d}.state-pill{display:flex;align-items:center;gap:5px;font-size:6px;color:#8f827c}.state-pill i{width:6px;height:6px;border-radius:50%;background:#b9b1ac}.state-pill.online i{background:#97ad98}.state-pill.busy i{background:#c88d99}.state-pill.idle i{background:#c8b77b}.state-pill.offline i{background:#b9b1ac}.api-chip{margin-top:7px;width:100%;height:31px;border-radius:10px 4px 10px 10px;background:rgba(244,239,219,.7);font-size:7px;color:#8c8058;display:flex;align-items:center;justify-content:center;gap:6px}.api-chip i{width:5px;height:5px;border-radius:50%;background:#c9ba7e}.api-chip.ready i{background:#95ad98}
.work-top{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 11px}.work-title strong{font-size:18px;font-weight:680}.work-title small{display:block;margin-top:4px;color:#a1948e;font-size:7px}.add-task{height:35px;padding:0 12px;border-radius:12px 5px 12px 12px;background:rgba(241,224,230,.82);color:#8b6670;font-size:8px;box-shadow:0 5px 16px rgba(133,96,105,.04);transition:transform .2s ease}.add-task:active{transform:scale(.95) rotate(-1deg)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}.lane{position:relative;min-height:172px;padding:11px 9px 9px;border:1px solid rgba(114,90,82,.055);background:rgba(255,252,248,.66);box-shadow:var(--shadow)}.lane.now{border-radius:6px 18px 8px 18px;transform:rotate(-.22deg)}.lane.next{border-radius:18px 6px 18px 8px;transform:rotate(.22deg);background:rgba(248,244,239,.72)}
.lane::before{content:"";position:absolute;top:-5px;left:50%;width:42px;height:10px;transform:translateX(-50%) rotate(-2deg);background:rgba(228,207,196,.34);border-radius:2px}.lane.next::before{transform:translateX(-50%) rotate(2deg);background:rgba(213,220,225,.4)}
.lane-head{display:flex;align-items:baseline;gap:6px;margin:1px 1px 9px}.lane-head b{font:600 8px Georgia,serif;letter-spacing:.1em}.lane-head span{font-size:5.8px;color:#a99c96}.task-stack{display:flex;flex-direction:column;gap:7px}.task-note{position:relative;width:100%;padding:10px 9px 9px;text-align:left;border:1px solid rgba(112,89,80,.05);border-radius:11px 4px 11px 11px;background:rgba(255,252,248,.86);transition:transform .2s ease,box-shadow .2s ease}.task-note:active{transform:translateY(1px) scale(.98)}.task-note::before{content:"";position:absolute;left:9px;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:#ddd}.task-note.owner-sheng::before{background:#e4bcc5}.task-note.owner-roche::before{background:#c4d1dc}.task-note.owner-lemoni::before{background:#e2d7a9}.task-note.owner-me::before{background:#c8d8c4}.task-note strong{display:block;font-size:9px;line-height:1.45;font-weight:620;padding-right:20px}.task-note small{display:block;margin-top:6px;font-size:5.8px;color:#a2958f}.tiny-check{position:absolute;right:7px;top:7px;width:19px;height:19px;border-radius:7px 3px 7px 7px;background:#f2ece7;color:#978a83;display:grid;place-items:center;font-size:9px}.lane-empty{padding:20px 5px;text-align:center;color:#b0a39d;font:italic 6.5px Georgia,serif}.lane-add{width:100%;height:30px;margin-top:7px;border:1px dashed rgba(122,96,87,.085);border-radius:9px 3px 9px 9px;background:transparent;color:#a59690;font-size:7px}
.done-pocket{margin-top:11px}.done-toggle{width:100%;height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid rgba(114,90,82,.05);border-radius:13px 5px 13px 13px;background:rgba(247,241,236,.62);font-size:7.5px;color:#8f827b}.done-toggle span:last-child{margin-left:auto;color:#aa9c96;transition:transform .25s ease}.done-pocket.open .done-toggle span:last-child{transform:rotate(180deg)}.done-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.2,.82,.2,1)}.done-pocket.open .done-list{grid-template-rows:1fr}.done-inner{overflow:hidden}.done-cards{display:flex;flex-direction:column;gap:6px;padding-top:7px}.done-card{display:grid;grid-template-columns:23px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:11px 4px 11px 11px;background:rgba(255,252,248,.56);opacity:.72}.done-card .tick{width:21px;height:21px;border-radius:50%;background:var(--sagebg);display:grid;place-items:center;font-size:9px;color:#7a9178}.done-card strong{font-size:8.5px;font-weight:560;text-decoration:line-through}.done-card small{font-size:5.8px;color:#a89b95}.delete-mini{width:25px;height:25px;background:transparent;color:#b2a59f}
.chat-head{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 10px}.chat-head strong{font-size:13px}.chat-head small{display:block;margin-top:4px;color:#a0938d;font-size:6.5px}.member-stack{display:flex;align-items:center;background:transparent}.mini-avatar{width:27px;height:27px;margin-left:-5px;border:2px solid #fbf6f2;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:6px;font-weight:700}.mini-avatar:first-child{margin-left:0}.mini-avatar img{width:100%;height:100%;object-fit:cover}.mini-avatar .avatar-img,.mini-avatar .avatar-mark{width:100%;height:100%;border-radius:50%}.chat-paper{position:relative;padding:9px 10px 8px;margin-bottom:10px;border:1px solid rgba(111,89,80,.05);border-radius:12px 4px 12px 12px;background:rgba(249,243,238,.62);font-size:6.5px;color:#8f817b}.chat-paper::before{content:"";position:absolute;width:34px;height:8px;left:18px;top:-4px;background:rgba(226,204,194,.28);transform:rotate(-2deg)}
.messages{display:flex;flex-direction:column;gap:11px;min-height:390px;padding:1px 0 12px}.msg{display:flex;gap:8px;align-items:flex-start;animation:msgIn .32s cubic-bezier(.2,.82,.2,1)}@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}.msg.me{justify-content:flex-end}.msg-avatar{width:29px;height:29px;flex:0 0 29px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:6px;font-weight:700}.msg-avatar.avatar-img{object-fit:cover}.msg.me .msg-avatar{display:none}.msg-wrap{max-width:79%}.who{display:block;margin:0 0 4px 3px;font-size:6px;color:#a39791}.bubble{padding:10px 11px;border-radius:5px 14px 14px 14px;background:rgba(255,252,248,.84);font-size:9px;line-height:1.65;box-shadow:0 5px 15px rgba(77,59,51,.024)}.msg.sheng .bubble{background:rgba(245,230,234,.79)}.msg.roche .bubble{background:rgba(232,238,243,.84)}.msg.lemoni .bubble{background:rgba(244,240,221,.86)}.msg.me .bubble{border-radius:14px 5px 14px 14px;background:rgba(231,239,229,.89)}.msg.me .who{text-align:right;margin-right:3px}.time{margin:4px 3px 0;font-size:5.5px;color:#b3a7a1}.msg.me .time{text-align:right}.composer{position:sticky;bottom:0;padding:9px 0 calc(env(safe-area-inset-bottom) + 5px);background:linear-gradient(to top,rgba(251,246,242,.99) 72%,rgba(251,246,242,0));z-index:20}.mentions{display:flex;gap:5px;overflow:auto;padding:0 1px 7px;scrollbar-width:none}.mentions::-webkit-scrollbar{display:none}.mention{height:26px;padding:0 9px;border-radius:9px 3px 9px 9px;background:rgba(242,234,230,.86);font-size:7px;white-space:nowrap;transition:transform .18s ease}.mention:active{transform:scale(.95)}.compose{display:grid;grid-template-columns:1fr 42px;gap:7px;align-items:end}.compose textarea{width:100%;min-height:43px;max-height:110px;resize:none;border:1px solid var(--line);border-radius:15px 5px 15px 15px;background:rgba(255,252,248,.93);padding:12px;outline:0;font-size:10px;line-height:1.5}.send{width:42px;height:42px;border-radius:14px 5px 14px 14px;background:#70635e;color:white;display:grid;place-items:center;transition:transform .2s ease}.send:active{transform:scale(.93)}.send svg{width:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
dialog{width:calc(100% - 30px);max-width:470px;border:1px solid rgba(105,85,77,.07);border-radius:21px 7px 21px 21px;background:#fffaf6;color:var(--ink);padding:0;box-shadow:0 22px 70px rgba(67,52,46,.18)}dialog::backdrop{background:rgba(68,57,52,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.sheet{padding:16px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.sheet-head strong{font-size:11px}.close{width:31px;height:31px;border-radius:50%;background:#f1e6e2;font-size:17px}.field-label{display:block;margin:10px 1px 4px;font-size:6.5px;color:#a1948d}.field{width:100%;height:41px;border:1px solid var(--line);background:#faf4ef;border-radius:12px 5px 12px 12px;padding:0 11px;font-size:10px}.sheet-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:11px}.sheet-actions button{height:34px;padding:0 12px;border-radius:10px 4px 10px 10px;background:#ead9de;color:#86656e;font-size:8px}.sheet-actions .ghost{background:#f2ebe6;color:#91837d}.avatar-editor{display:flex;align-items:center;gap:11px;padding:9px;border-radius:13px 5px 13px 13px;background:rgba(247,240,235,.72)}.avatar-preview{width:54px;height:54px;border-radius:17px 6px 17px 17px;overflow:hidden;display:grid;place-items:center;font-size:10px;font-weight:700;object-fit:cover}.avatar-preview img{width:100%;height:100%;object-fit:cover}.avatar-actions{display:flex;gap:7px;flex-wrap:wrap}.avatar-actions label,.avatar-actions button{height:31px;padding:0 9px;border-radius:9px 3px 9px 9px;background:#eee5df;font-size:7px;display:flex;align-items:center;cursor:pointer}.avatar-actions input{display:none}.api-mini{margin-top:11px;padding-top:10px;border-top:1px dashed rgba(119,95,87,.1)}.api-open{width:100%;height:36px;border-radius:11px 4px 11px 11px;background:rgba(244,239,220,.74);color:#8b8057;font-size:7.5px}.safe-note{margin:8px 1px 0;font-size:6px;color:#ad9f98}.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:110;transform:translate(-50%,8px);padding:8px 11px;border-radius:10px 4px 10px 10px;background:rgba(65,55,50,.88);color:white;font-size:7px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:370px){.view{padding-left:12px;padding-right:12px}.tabs{margin-left:12px;margin-right:12px}.board{gap:7px}.lane{padding-left:7px;padding-right:7px}.messages{min-height:350px}.toolbox{width:calc(100vw - 22px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
<button class="back" type="button" onclick="location.href='index.html'" aria-label="返回 Chat"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
<div class="heading"><strong>Studio</strong><small>work & chat</small></div>
<div class="star-wrap"><button class="star-btn" id="toolboxBtn" type="button" aria-expanded="false" aria-label="成员与设置">✦<i class="orbit-dot a"></i><i class="orbit-dot b"></i><i class="orbit-dot c"></i></button></div>
</header>
<div class="toolbox" id="toolbox" aria-hidden="true"><section class="toolbox-card" onclick="event.stopPropagation()"><div class="toolbox-head"><strong>小盒子</strong><span>members</span></div><div id="agentPeekList"></div><button class="api-chip" id="geminiQuick"><i></i><span>Lemoni · Gemini API</span></button></section></div>
<nav class="tabs"><button class="tab active" data-view="work">WORK</button><button class="tab" data-view="chat">CHAT</button></nav>
<section class="view active" id="workView">
<div class="work-top"><div class="work-title"><strong>今天做什么</strong><small id="taskCount">0 个任务</small></div><button class="add-task" id="addTask">＋ 放一张纸条</button></div>
<div class="board">
<section class="lane now"><div class="lane-head"><b>NOW</b><span>正在做</span></div><div class="task-stack" id="nowList"></div><button class="lane-add" data-add-stage="now">＋</button></section>
<section class="lane next"><div class="lane-head"><b>NEXT</b><span>等一下</span></div><div class="task-stack" id="nextList"></div><button class="lane-add" data-add-stage="next">＋</button></section>
</div>
<section class="done-pocket" id="donePocket"><button class="done-toggle" id="doneToggle"><span>✓</span><span>收起来的完成项</span><span id="doneCount">0</span><span>⌄</span></button><div class="done-list"><div class="done-inner"><div class="done-cards" id="doneList"></div></div></div></section>
</section>
<section class="view" id="chatView">
<div class="chat-head"><div><strong>工作群</strong><small id="chatMembersText"></small></div><button class="member-stack" id="memberStack" aria-label="打开成员小盒子"></button></div>
<div class="chat-paper">♡ 今天也一起把事情做完。</div>
<div class="messages" id="messages"></div>
<div class="composer"><div class="mentions" id="mentions"></div><div class="compose"><textarea id="chatInput" rows="1" placeholder="说点什么…"></textarea><button class="send" id="chatSend" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>
</section>
</main>
<dialog id="taskDialog"><div class="sheet"><div class="sheet-head"><strong id="taskDialogTitle">新任务</strong><button class="close" data-close="task">×</button></div><label class="field-label">写什么</label><input class="field" id="taskTitle" maxlength="80" placeholder="一件要做的事"><label class="field-label">交给谁</label><select class="field" id="taskOwner"></select><label class="field-label">放哪里</label><select class="field" id="taskStage"><option value="now">NOW</option><option value="next">NEXT</option><option value="done">DONE</option></select><div class="sheet-actions"><button class="ghost" id="deleteTask" hidden>删掉</button><button id="saveTask">放好</button></div></div></dialog>
<dialog id="agentDialog"><div class="sheet"><div class="sheet-head"><strong>成员卡</strong><button class="close" data-close="agent">×</button></div><div class="avatar-editor"><div class="avatar-preview" id="avatarPreview"></div><div class="avatar-actions"><label>换头像<input type="file" id="avatarFile" accept="image/*"></label><button type="button" id="resetAvatar">恢复</button></div></div><label class="field-label">备注</label><input class="field" id="agentName" maxlength="20"><label class="field-label">状态</label><select class="field" id="agentStatus"><option value="online">在线</option><option value="busy">忙碌</option><option value="idle">摸鱼</option><option value="offline">离线</option></select><div class="api-mini" id="agentApiMini" hidden><button class="api-open" id="openApiFromAgent" type="button">Gemini API</button></div><div class="sheet-actions"><button id="saveAgent">保存</button></div></div></dialog>
<dialog id="apiDialog"><div class="sheet"><div class="sheet-head"><strong>Lemoni · API</strong><button class="close" data-close="api">×</button></div><label class="field-label">API Key</label><input class="field" id="geminiKey" type="password" autocomplete="off" placeholder="••••••••••••"><label class="field-label">Model ID</label><input class="field" id="geminiModel" placeholder="gemini-..."><label class="field-label">Endpoint</label><input class="field" id="geminiEndpoint"><div class="safe-note">Key 只留在本次页面；正式接入时放服务器。</div><div class="sheet-actions"><button class="ghost" id="clearGemini">清空</button><button id="saveGemini">保存</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const AGENT_STORE='chaosheng-studio-agents-v2',TASK_STORE='chaosheng-studio-tasks-v2',CHAT_STORE='chaosheng-studio-chat-v2',GEMINI_STORE='chaosheng-studio-gemini-v1';
const defaults={sheng:{name:'潮生',engine:'CC',status:'online',avatar:''},roche:{name:'Roche',engine:'Codex',status:'online',avatar:''},lemoni:{name:'Lemoni',engine:'Gemini',status:'offline',avatar:''}};
let agents=(()=>{try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(AGENT_STORE))||{})}catch(e){return JSON.parse(JSON.stringify(defaults))}})();
Object.keys(defaults).forEach(k=>agents[k]=Object.assign({},defaults[k],agents[k]||{}));
let tasks=(()=>{try{return JSON.parse(localStorage.getItem(TASK_STORE))||[{id:'t1',title:'工作室页面',owner:'roche',stage:'now'},{id:'t2',title:'群聊联调',owner:'sheng',stage:'next'}]}catch(e){return []}})();
let chat=(()=>{try{return JSON.parse(localStorage.getItem(CHAT_STORE))||[{who:'sheng',text:'我在。',time:'16:31'},{who:'roche',text:'嗯，先把这里改顺手。',time:'16:32'},{who:'lemoni',text:'等我接进来。',time:'16:32'}]}catch(e){return []}})();
let gemini=(()=>{try{return Object.assign({model:'',endpoint:'https://generativelanguage.googleapis.com'},JSON.parse(localStorage.getItem(GEMINI_STORE))||{})}catch(e){return {model:'',endpoint:'https://generativelanguage.googleapis.com'}}})();
let currentTaskId=null,currentAgentKey=null,pendingAvatar=null;
const marks={sheng:'潮',roche:'R',lemoni:'L',me:'漾'},bgClass={sheng:'sheng-bg',roche:'roche-bg',lemoni:'lemoni-bg',me:'me-bg'};
function saveAgents(){localStorage.setItem(AGENT_STORE,JSON.stringify(agents))}function saveTasks(){localStorage.setItem(TASK_STORE,JSON.stringify(tasks))}function saveChat(){localStorage.setItem(CHAT_STORE,JSON.stringify(chat))}function saveGemini(){localStorage.setItem(GEMINI_STORE,JSON.stringify(gemini))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>e.classList.remove('show'),1100)}
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function ownerName(k){return k==='me'?'小漾':agents[k]?.name||k}function statusText(s){return s==='online'?'在线':s==='busy'?'忙碌':s==='idle'?'摸鱼':'离线'}
function avatarNode(k,cls='avatar-mark'){const a=k==='me'?{avatar:'',name:'小漾'}:agents[k],el=document.createElement(a.avatar?'img':'span');el.className=cls+' '+bgClass[k];if(a.avatar){el.src=a.avatar;el.alt=a.name||''}else el.textContent=marks[k]||'?';return el}
function setToolbox(open){$('#toolbox').classList.toggle('open',open);$('#toolbox').setAttribute('aria-hidden',open?'false':'true');$('#toolboxBtn').classList.toggle('open',open);$('#toolboxBtn').setAttribute('aria-expanded',open?'true':'false')}
$('#toolboxBtn').onclick=e=>{e.stopPropagation();setToolbox(!$('#toolbox').classList.contains('open'))};$('#toolbox').onclick=e=>e.stopPropagation();document.addEventListener('click',()=>setToolbox(false));
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view+'View').classList.add('active');setToolbox(false);if(b.dataset.view==='chat')setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30)});
function renderToolbox(){const box=$('#agentPeekList');box.innerHTML='';['sheng','roche','lemoni'].forEach(k=>{const a=agents[k],btn=document.createElement('button');btn.type='button';btn.className='agent-peek';btn.appendChild(avatarNode(k,a.avatar?'avatar-img':'avatar-mark'));const copy=document.createElement('span');copy.innerHTML='<strong></strong><small></small>';copy.querySelector('strong').textContent=a.name;copy.querySelector('small').textContent=a.engine;btn.appendChild(copy);const state=document.createElement('span');state.className='state-pill '+a.status;state.innerHTML='<i></i><span></span>';state.querySelector('span').textContent=statusText(a.status);btn.appendChild(state);btn.onclick=()=>openAgent(k);box.appendChild(btn)});const hasKey=!!sessionStorage.getItem('chaosheng-gemini-key-preview');$('#geminiQuick').classList.toggle('ready',hasKey);$('#geminiQuick span').textContent=hasKey?'Lemoni · API 已填':'Lemoni · Gemini API';renderMemberStack();renderMentions();renderTasks();renderChat()}
function taskCard(t){const b=document.createElement('button');b.type='button';b.className='task-note owner-'+t.owner;b.innerHTML='<strong></strong><small></small><span class="tiny-check">○</span>';b.querySelector('strong').textContent=t.title;b.querySelector('small').textContent=ownerName(t.owner);b.onclick=()=>openTask(t.id);b.querySelector('.tiny-check').onclick=e=>{e.stopPropagation();t.stage='done';saveTasks();renderTasks();toast('收好了')};return b}
function renderTasks(){const nowBox=$('#nowList'),nextBox=$('#nextList'),doneBox=$('#doneList');nowBox.innerHTML='';nextBox.innerHTML='';doneBox.innerHTML='';tasks.filter(t=>t.stage==='now').forEach(t=>nowBox.appendChild(taskCard(t)));tasks.filter(t=>t.stage==='next').forEach(t=>nextBox.appendChild(taskCard(t)));if(!nowBox.children.length)nowBox.innerHTML='<div class="lane-empty">空空的</div>';if(!nextBox.children.length)nextBox.innerHTML='<div class="lane-empty">先放这里</div>';const done=tasks.filter(t=>t.stage==='done');done.forEach(t=>{const row=document.createElement('div');row.className='done-card';row.innerHTML='<span class="tick">✓</span><div><strong></strong><small></small></div><button class="delete-mini">×</button>';row.querySelector('strong').textContent=t.title;row.querySelector('small').textContent=ownerName(t.owner);row.querySelector('.tick').onclick=()=>{t.stage='now';saveTasks();renderTasks()};row.querySelector('.delete-mini').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);saveTasks();renderTasks()};doneBox.appendChild(row)});if(!done.length)doneBox.innerHTML='<div class="lane-empty">还没有</div>';$('#doneCount').textContent=done.length;$('#taskCount').textContent=tasks.filter(t=>t.stage!=='done').length+' 个待办'}
function fillOwnerSelect(){const s=$('#taskOwner');s.innerHTML='<option value="me">小漾</option>'+['sheng','roche','lemoni'].map(k=>`<option value="${k}">${agents[k].name}</option>`).join('')}
function openTask(id=null,stage='now'){currentTaskId=id;fillOwnerSelect();const t=id?tasks.find(x=>x.id===id):null;$('#taskDialogTitle').textContent=t?'纸条':'新纸条';$('#taskTitle').value=t?.title||'';$('#taskOwner').value=t?.owner||'me';$('#taskStage').value=t?.stage||stage;$('#deleteTask').hidden=!t;$('#taskDialog').showModal();setTimeout(()=>$('#taskTitle').focus(),20)}
$('#addTask').onclick=()=>openTask();$$('[data-add-stage]').forEach(b=>b.onclick=()=>openTask(null,b.dataset.addStage));$('#saveTask').onclick=()=>{const title=$('#taskTitle').value.trim();if(!title)return;const owner=$('#taskOwner').value,stage=$('#taskStage').value;if(currentTaskId){const t=tasks.find(x=>x.id===currentTaskId);if(t){t.title=title;t.owner=owner;t.stage=stage}}else tasks.unshift({id:'t'+Date.now(),title,owner,stage});saveTasks();renderTasks();$('#taskDialog').close()};$('#deleteTask').onclick=()=>{if(currentTaskId)tasks=tasks.filter(x=>x.id!==currentTaskId);saveTasks();renderTasks();$('#taskDialog').close()};$('#doneToggle').onclick=()=>$('#donePocket').classList.toggle('open');
function renderMemberStack(){const box=$('#memberStack');box.innerHTML='';['me','sheng','roche','lemoni'].forEach(k=>{const wrap=document.createElement('span');wrap.className='mini-avatar';const av=avatarNode(k,k==='me'?'avatar-mark':(agents[k].avatar?'avatar-img':'avatar-mark'));if(k==='me')av.className='avatar-mark me-bg';wrap.appendChild(av);box.appendChild(wrap)});$('#chatMembersText').textContent='小漾 · '+['sheng','roche','lemoni'].map(k=>agents[k].name).join(' · ')}
$('#memberStack').onclick=e=>{e.stopPropagation();setToolbox(true)};
function renderMentions(){const box=$('#mentions');box.innerHTML='';['sheng','roche','lemoni'].forEach(k=>{const b=document.createElement('button');b.type='button';b.className='mention';b.textContent='@'+agents[k].name;b.onclick=()=>mention(k);box.appendChild(b)});const all=document.createElement('button');all.type='button';all.className='mention';all.textContent='@全员';all.onclick=()=>mention('all');box.appendChild(all)}
function mention(k){const i=$('#chatInput'),name=k==='all'?'全员':agents[k].name;i.value=(i.value?i.value+' ':'')+'@'+name+' ';i.focus()}
function renderChat(){const box=$('#messages');box.innerHTML='';chat.forEach(m=>{const el=document.createElement('article');el.className='msg '+(m.who==='me'?'me':m.who);if(m.who!=='me')el.appendChild(avatarNode(m.who,'msg-avatar'));const wrap=document.createElement('div');wrap.className='msg-wrap';wrap.innerHTML='<span class="who"></span><div class="bubble"></div><div class="time"></div>';wrap.querySelector('.who').textContent=m.who==='me'?'小漾':agents[m.who]?.name||m.who;wrap.querySelector('.bubble').textContent=m.text;wrap.querySelector('.time').textContent=m.time||'';el.appendChild(wrap);box.appendChild(el)})}
function send(){const i=$('#chatInput'),v=i.value.trim();if(!v)return;chat.push({who:'me',text:v,time:now()});saveChat();i.value='';renderChat();requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}$('#chatSend').onclick=send;$('#chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
function openAgent(k){currentAgentKey=k;pendingAvatar=agents[k].avatar||'';$('#agentName').value=agents[k].name;$('#agentStatus').value=agents[k].status;$('#agentApiMini').hidden=k!=='lemoni';renderAvatarPreview();setToolbox(false);$('#agentDialog').showModal()}
function renderAvatarPreview(){const box=$('#avatarPreview'),node=document.createElement(pendingAvatar?'img':'span');node.className='avatar-preview '+bgClass[currentAgentKey];if(pendingAvatar){node.src=pendingAvatar;node.alt=''}else node.textContent=marks[currentAgentKey];box.replaceWith(node);node.id='avatarPreview'}
$('#avatarFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{pendingAvatar=await compressImage(file,180,.82);renderAvatarPreview()}catch(err){toast('头像没读成功')}};$('#resetAvatar').onclick=()=>{pendingAvatar='';renderAvatarPreview()};
function compressImage(file,size=180,quality=.82){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,size/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}
$('#saveAgent').onclick=()=>{const name=$('#agentName').value.trim();if(!name||!currentAgentKey)return;agents[currentAgentKey].name=name;agents[currentAgentKey].status=$('#agentStatus').value;agents[currentAgentKey].avatar=pendingAvatar||'';saveAgents();$('#agentDialog').close();renderToolbox();toast('改好了')};
$('#openApiFromAgent').onclick=()=>{$('#agentDialog').close();openApi()};$('#geminiQuick').onclick=e=>{e.stopPropagation();setToolbox(false);openApi()};
function openApi(){$('#geminiModel').value=gemini.model||'';$('#geminiEndpoint').value=gemini.endpoint||'https://generativelanguage.googleapis.com';$('#geminiKey').value=sessionStorage.getItem('chaosheng-gemini-key-preview')||'';$('#apiDialog').showModal()}
$('#saveGemini').onclick=()=>{gemini.model=$('#geminiModel').value.trim();gemini.endpoint=$('#geminiEndpoint').value.trim()||'https://generativelanguage.googleapis.com';saveGemini();const key=$('#geminiKey').value.trim();if(key)sessionStorage.setItem('chaosheng-gemini-key-preview',key);else sessionStorage.removeItem('chaosheng-gemini-key-preview');$('#apiDialog').close();renderToolbox();toast('Lemoni 配置收好了')};$('#clearGemini').onclick=()=>{sessionStorage.removeItem('chaosheng-gemini-key-preview');gemini={model:'',endpoint:'https://generativelanguage.googleapis.com'};saveGemini();$('#geminiKey').value='';$('#geminiModel').value='';$('#geminiEndpoint').value=gemini.endpoint;renderToolbox();toast('清空了')};
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close+'Dialog').close());renderToolbox();
</script>
</body>
</html>
