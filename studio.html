olor:#b0a39d;font:italic 6.5px Georgia,serif}.lane-add{width:100%;height:30px;margin-top:7px;border:1px dashed rgba(122,96,87,.085);border-radius:9px 3px 9px 9px;background:transparent;color:#a59690}.done-pocket{margin-top:11px}.done-toggle{width:100%;height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;border-radius:13px 5px 13px 13px;background:rgba(247,241,236,.62);font-size:7.5px}.done-toggle span:last-child{margin-left:auto}.done-list{display:none}.done-pocket.open .done-list{display:block}.done-cards{display:flex;flex-direction:column;gap:6px;padding-top:7px}.done-card{display:grid;grid-template-columns:23px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border-radius:11px 4px 11px 11px;background:rgba(255,252,248,.56);opacity:.72}.done-card strong{font-size:8.5px;text-decoration:line-through}.done-card small{font-size:5.8px;color:#a89b95}

.image-msg{max-width:210px;border-radius:12px 4px 12px 12px;display:block}.file-msg{display:flex;align-items:center;gap:8px;min-width:190px}.file-icon{width:34px;height:34px;border-radius:10px 4px 10px 10px;background:rgba(255,255,255,.45);display:grid;place-items:center;font-size:15px}.file-copy strong{display:block;font-size:8px}.file-copy small{display:block;margin-top:3px;font-size:6px;color:#91847e}.sticker-msg{font-size:32px;line-height:1;padding:4px 2px}.voice-msg{display:flex;align-items:center;gap:8px;min-width:130px}.voice-wave{letter-spacing:2px;color:#789080}.voice-time{font-size:7px;color:#857973}
.composer{flex:0 0 auto;position:relative;margin:0 -15px;padding:8px 15px calc(env(safe-area-inset-bottom) + 8px);background:rgba(251,246,242,.94);border-top:1px solid rgba(112,89,80,.045);backdrop-filter:blur(12px);z-index:20}.mentions{display:flex;gap:5px;overflow:auto;padding:0 1px 7px;scrollbar-width:none}.mention{height:25px;padding:0 9px;border-radius:9px 3px 9px 9px;background:rgba(242,234,230,.86);font-size:7px;white-space:nowrap}.compose{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:end}.more-btn,.send{width:42px;height:42px;border-radius:14px 5px 14px 14px;display:grid;place-items:center}.more-btn{background:rgba(241,230,226,.92);font-size:21px;color:#8c7770;transition:transform .25s}.more-btn.open{transform:rotate(45deg);background:rgba(238,220,226,.9)}.compose textarea{width:100%;min-height:43px;max-height:104px;resize:none;border:1px solid var(--line);border-radius:15px 5px 15px 15px;background:rgba(255,252,248,.96);padding:12px;font-size:10px}.send{background:#70635e;color:#fff}.send svg{width:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.more-panel{position:absolute;left:15px;right:15px;bottom:calc(env(safe-area-inset-bottom) + 61px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;border:1px solid rgba(113,89,81,.06);border-radius:18px 6px 18px 18px;background:rgba(255,250,247,.98);box-shadow:0 16px 45px rgba(68,52,45,.12);opacity:0;pointer-events:none;transform:translateY(8px) scale(.97);transition:.25s}.more-panel.open{opacity:1;pointer-events:auto;transform:none}.more-item{min-width:0;height:63px;border-radius:13px 5px 13px 13px;background:rgba(247,240,235,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.more-item b{font-size:17px;font-weight:500}.more-item span{font-size:6.5px}.sticker-panel{position:absolute;left:15px;bottom:calc(env(safe-area-inset-bottom) + 132px);width:214px;padding:9px;border-radius:16px 6px 16px 16px;background:#fffaf7;box-shadow:0 14px 40px rgba(70,52,45,.12);display:none;grid-template-columns:repeat(4,1fr);gap:5px}.sticker-panel.open{display:grid}.sticker{height:42px;border-radius:10px;background:#f7efea;font-size:22px}.recording .more-item[data-action="voice"]{background:#f3dfe4;animation:pulse 1.1s ease infinite}@keyframes pulse{50%{transform:scale(.96)}}
dialog{width:calc(100% - 30px);max-width:470px;border:1px solid rgba(105,85,77,.07);border-radius:21px 7px 21px 21px;background:#fffaf6;padding:0}.sheet{padding:16px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.close{width:31px;height:31px;border-radius:50%;background:#f1e6e2}.field-label{display:block;margin:10px 1px 4px;font-size:6.5px;color:#a1948d}.field{width:100%;height:41px;border:1px solid var(--line);background:#faf4ef;border-radius:12px 5px 12px 12px;padding:0 11px;font-size:10px}.sheet-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:11px}.sheet-actions button{height:34px;padding:0 12px;border-radius:10px 4px 10px 10px;background:#ead9de;color:#86656e;font-size:8px}.avatar-editor{display:flex;gap:11px;align-items:center}.avatar-preview{width:54px;height:54px;border-radius:17px 6px 17px 17px;overflow:hidden;display:grid;place-items:center}.avatar-preview img{width:100%;height:100%;object-fit:cover}.avatar-actions{display:flex;gap:7px}.avatar-actions label,.avatar-actions button{height:31px;padding:0 9px;border-radius:9px;background:#eee5df;font-size:7px;display:flex;align-items:center}.avatar-actions input{display:none}.toast{position:fixed;left:50%;bottom:20px;z-index:110;transform:translate(-50%,8px);padding:8px 11px;border-radius:10px 4px 10px 10px;background:rgba(65,55,50,.88);color:white;font-size:7px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:370px){.view{padding-left:12px;padding-right:12px}.composer{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.more-panel{left:12px;right:12px}.board{gap:7px}}
</style>

<body>
<main class="app">
<header class="topbar"><button class="back" onclick="location.href='index.html'" aria-label="返回 Chat"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><div class="heading"><strong>Studio</strong><small>work & chat</small></div><div class="star-wrap"><button class="star-btn" id="toolboxBtn">✦<i class="orbit-dot a"></i><i class="orbit-dot b"></i><i class="orbit-dot c"></i></button></div></header>
<div class="toolbox" id="toolbox"><section class="toolbox-card" onclick="event.stopPropagation()"><div class="toolbox-head"><strong>小盒子</strong><span>members</span></div><div id="agentPeekList"></div><button class="api-chip" id="geminiQuick">Lemoni · Gemini API</button></section></div>
<nav class="tabs"><button class="tab active" data-view="work">WORK</button><button class="tab" data-view="chat">CHAT</button></nav>
<section class="view active" id="workView"><div class="work-top"><div class="work-title"><strong>今天做什么</strong><small id="taskCount"></small></div><button class="add-task" id="addTask">＋ 放一张纸条</button></div><div class="board"><section class="lane now"><div class="lane-head"><b>NOW</b><span>正在做</span></div><div class="task-stack" id="nowList"></div><button class="lane-add" data-add-stage="now">＋</button></section><section class="lane next"><div class="lane-head"><b>NEXT</b><span>等一下</span></div><div class="task-stack" id="nextList"></div><button class="lane-add" data-add-stage="next">＋</button></section></div><section class="done-pocket" id="donePocket"><button class="done-toggle" id="doneToggle"><span>✓</span><span>收起来的完成项</span><span id="doneCount">0</span><span>⌄</span></button><div class="done-list"><div class="done-cards" id="doneList"></div></div></section></section>
<section class="view" id="chatView"><div class="chat-head"><div><strong>工作群</strong><small id="chatMembersText"></small></div><button class="member-stack" id="memberStack"></button></div><div class="chat-paper">♡ 今天也一起把事情做完。</div><div class="messages" id="messages"></div><div class="composer"><div class="mentions" id="mentions"></div><div class="more-panel" id="morePanel"><button class="more-item" data-action="image"><b>▧</b><span>图片</span></button><button class="more-item" data-action="file"><b>⌑</b><span>附件</span></button><button class="more-item" data-action="sticker"><b>☺</b><span>表情包</span></button><button class="more-item" data-action="voice"><b>◉</b><span id="voiceLabel">语音</span></button></div><div class="sticker-panel" id="stickerPanel"></div><div class="compose"><button class="more-btn" id="moreBtn" aria-label="更多">＋</button><textarea id="chatInput" rows="1" placeholder="说点什么…"></textarea><button class="send" id="chatSend" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div><input id="imageInput" type="file" accept="image/*" hidden><input id="fileInput" type="file" hidden></div></section>
</main>
<dialog id="taskDialog"><div class="sheet"><div class="sheet-head"><strong id="taskDialogTitle">新纸条</strong><button class="close" data-close="task">×</button></div><label class="field-label">写什么</label><input class="field" id="taskTitle"><label class="field-label">交给谁</label><select class="field" id="taskOwner"></select><label class="field-label">放哪里</label><select class="field" id="taskStage"><option value="now">NOW</option><option value="next">NEXT</option><option value="done">DONE</option></select><div class="sheet-actions"><button id="saveTask">放好</button></div></div></dialog>
<dialog id="agentDialog"><div class="sheet"><div class="sheet-head"><strong>成员卡</strong><button class="close" data-close="agent">×</button></div><div class="avatar-editor"><div class="avatar-preview" id="avatarPreview"></div><div class="avatar-actions"><label>换头像<input type="file" id="avatarFile" accept="image/*"></label><button id="resetAvatar">恢复</button></div></div><label class="field-label">备注</label><input class="field" id="agentName"><label class="field-label">状态</label><select class="field" id="agentStatus"><option value="online">在线</option><option value="busy">忙碌</option><option value="idle">摸鱼</option><option value="offline">离线</option></select><div class="sheet-actions"><button id="saveAgent">保存</button></div></div></dialog>
<dialog id="apiDialog"><div class="sheet"><div class="sheet-head"><strong>Lemoni · API</strong><button class="close" data-close="api">×</button></div><label class="field-label">API Key</label><input class="field" id="geminiKey" type="password"><label class="field-label">Model ID</label><input class="field" id="geminiModel"><label class="field-label">Endpoint</label><input class="field" id="geminiEndpoint"><div class="sheet-actions"><button id="saveGemini">保存</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const A='chaosheng-studio-agents-v2',T='chaosheng-studio-tasks-v2',C='chaosheng-studio-chat-v2',G='chaosheng-studio-gemini-v1';
const defaults={sheng:{name:'潮生',engine:'CC',status:'online',avatar:''},roche:{name:'Roche',engine:'Codex',status:'online',avatar:''},lemoni:{name:'Lemoni',engine:'Gemini',status:'offline',avatar:''}};
let agents=Object.assign({},defaults,JSON.parse(localStorage.getItem(A)||'{}'));Object.keys(defaults).forEach(k=>agents[k]=Object.assign({},defaults[k],agents[k]||{}));
let tasks=JSON.parse(localStorage.getItem(T)||'null')||[{id:'t1',title:'工作室页面',owner:'roche',stage:'now'},{id:'t2',title:'群聊联调',owner:'sheng',stage:'next'}];
let chat=JSON.parse(localStorage.getItem(C)||'null')||[{who:'sheng',type:'text',text:'我在。',time:'16:31'},{who:'roche',type:'text',text:'嗯，先把这里改顺手。',time:'16:32'}];
let gemini=Object.assign({model:'',endpoint:'https://generativelanguage.googleapis.com'},JSON.parse(localStorage.getItem(G)||'{}'));let currentTaskId=null,currentAgentKey=null,pendingAvatar='',recordStart=0,recordTimer=null;
const marks={sheng:'潮',roche:'R',lemoni:'L',me:'漾'},bgs={sheng:'sheng-bg',roche:'roche-bg',lemoni:'lemoni-bg',me:'me-bg'};
const save=()=>{localStorage.setItem(A,JSON.stringify(agents));localStorage.setItem(T,JSON.stringify(tasks));localStorage.setItem(C,JSON.stringify(chat));localStorage.setItem(G,JSON.stringify(gemini))};const now=()=>new Date().toTimeString().slice(0,5);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1000)}function ownerName(k){return k==='me'?'小漾':agents[k]?.name||k}function statusText(s){return {online:'在线',busy:'忙碌',idle:'摸鱼',offline:'离线'}[s]}
function avatar(k,cls='avatar-mark'){const a=k==='me'?{avatar:'',name:'小漾'}:agents[k],e=document.createElement(a.avatar?'img':'span');e.className=cls+' '+bgs[k];if(a.avatar){e.src=a.avatar;e.alt=a.name}else e.textContent=marks[k];return e}
function toolbox(open){$('#toolbox').classList.toggle('open',open);$('#toolboxBtn').classList.toggle('open',open)}$('#toolboxBtn').onclick=e=>{e.stopPropagation();toolbox(!$('#toolbox').classList.contains('open'))};$('#toolbox').onclick=e=>e.stopPropagation();document.addEventListener('click',()=>toolbox(false));
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view+'View').classList.add('active');toolbox(false);if(b.dataset.view==='chat')setTimeout(scrollChat,30)});
function renderToolbox(){const box=$('#agentPeekList');box.innerHTML='';['sheng','roche','lemoni'].forEach(k=>{const a=agents[k],btn=document.createElement('button');btn.className='agent-peek';btn.appendChild(avatar(k,a.avatar?'avatar-img':'avatar-mark'));const cp=document.createElement('span');cp.innerHTML='<strong></strong><small></small>';cp.querySelector('strong').textContent=a.name;cp.querySelector('small').textContent=a.engine;btn.appendChild(cp);const st=document.createElement('span');st.className='state-pill '+a.status;st.innerHTML='<i></i>'+statusText(a.status);btn.appendChild(st);btn.onclick=()=>openAgent(k);box.appendChild(btn)});$('#geminiQuick').classList.toggle('ready',!!sessionStorage.getItem('chaosheng-gemini-key-preview'));renderMembers();renderMentions();renderTasks();renderChat()}
function taskCard(t){const b=document.createElement('button');b.className='task-note owner-'+t.owner;b.innerHTML='<strong></strong><small></small><span class="tiny-check">○</span>';b.querySelector('strong').textContent=t.title;b.querySelector('small').textContent=ownerName(t.owner);b.onclick=()=>openTask(t.id);b.querySelector('.tiny-check').onclick=e=>{e.stopPropagation();t.stage='done';save();renderTasks()};return b}
function renderTasks(){for(const id of ['nowList','nextList','doneList'])$('#'+id).innerHTML='';tasks.filter(t=>t.stage==='now').forEach(t=>$('#nowList').appendChild(taskCard(t)));tasks.filter(t=>t.stage==='next').forEach(t=>$('#nextList').appendChild(taskCard(t)));for(const id of ['nowList','nextList'])if(!$('#'+id).children.length)$('#'+id).innerHTML='<div class="lane-empty">空空的</div>';const done=tasks.filter(t=>t.stage==='done');done.forEach(t=>{const d=document.createElement('div');d.className='done-card';d.innerHTML='<span>✓</span><div><strong></strong><small></small></div><button>×</button>';d.querySelector('strong').textContent=t.title;d.querySelector('small').textContent=ownerName(t.owner);d.querySelector('button').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();renderTasks()};$('#doneList').appendChild(d)});$('#doneCount').textContent=done.length;$('#taskCount').textContent=tasks.filter(t=>t.stage!=='done').length+' 个待办'}
function fillOwners(){taskOwner.innerHTML='<option value="me">小漾</option>'+['sheng','roche','lemoni'].map(k=>`<option value="${k}">${agents[k].name}</option>`).join('')}function openTask(id=null,stage='now'){currentTaskId=id;fillOwners();const t=tasks.find(x=>x.id===id);taskTitle.value=t?.title||'';taskOwner.value=t?.owner||'me';taskStage.value=t?.stage||stage;taskDialog.showModal()}addTask.onclick=()=>openTask();$$('[data-add-stage]').forEach(b=>b.onclick=()=>openTask(null,b.dataset.addStage));saveTask.onclick=()=>{const v=taskTitle.value.trim();if(!v)return;if(currentTaskId){const t=tasks.find(x=>x.id===currentTaskId);Object.assign(t,{title:v,owner:taskOwner.value,stage:taskStage.value})}else tasks.unshift({id:'t'+Date.now(),title:v,owner:taskOwner.value,stage:taskStage.value});save();renderTasks();taskDialog.close()};doneToggle.onclick=()=>donePocket.classList.toggle('open');
function renderMembers(){memberStack.innerHTML='';['me','sheng','roche','lemoni'].forEach(k=>{const w=document.createElement('span');w.className='mini-avatar';w.appendChild(avatar(k));memberStack.appendChild(w)});chatMembersText.textContent='小漾 · '+['sheng','roche','lemoni'].map(k=>agents[k].name).join(' · ')}memberStack.onclick=e=>{e.stopPropagation();toolbox(true)};
function renderMentions(){mentions.innerHTML='';['sheng','roche','lemoni'].forEach(k=>{const b=document.createElement('button');b.className='mention';b.textContent='@'+agents[k].name;b.onclick=()=>{chatInput.value+=(chatInput.value?' ':'')+'@'+agents[k].name+' ';chatInput.focus()};mentions.appendChild(b)})}
function bubbleContent(wrap,m){const b=wrap.querySelector('.bubble');b.innerHTML='';if(m.type==='image'){const img=document.createElement('img');img.className='image-msg';img.src=m.data;b.appendChild(img)}else if(m.type==='file'){b.classList.add('file-msg');b.innerHTML='<span class="file-icon">⌑</span><span class="file-copy"><strong></strong><small></small></span>';b.querySelector('strong').textContent=m.name;b.querySelector('small').textContent=m.size||'附件'}else if(m.type==='sticker'){b.innerHTML='<div class="sticker-msg"></div>';b.firstChild.textContent=m.text}else if(m.type==='voice'){b.innerHTML='<div class="voice-msg"><span class="voice-wave">▮▯▮▮▯▮</span><span class="voice-time"></span></div>';b.querySelector('.voice-time').textContent=(m.seconds||1)+'″'}else b.textContent=m.text||''}
function renderChat(){messages.innerHTML='';chat.forEach(m=>{const e=document.createElement('article');e.className='msg '+(m.who==='me'?'me':m.who);if(m.who!=='me')e.appendChild(avatar(m.who,'msg-avatar'));const w=document.createElement('div');w.className='msg-wrap';w.innerHTML='<span class="who"></span><div class="bubble"></div><div class="time"></div>';w.querySelector('.who').textContent=m.who==='me'?'小漾':agents[m.who]?.name||m.who;w.querySelector('.time').textContent=m.time||'';bubbleContent(w,m);e.appendChild(w);messages.appendChild(e)})}function scrollChat(){messages.scrollTop=messages.scrollHeight}
function pushMessage(m){chat.push(Object.assign({who:'me',time:now()},m));save();renderChat();requestAnimationFrame(scrollChat)}function sendText(){const v=chatInput.value.trim();if(!v)return;pushMessage({type:'text',text:v});chatInput.value=''}chatSend.onclick=sendText;chatInput.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};
function setMore(open){morePanel.classList.toggle('open',open);moreBtn.classList.toggle('open',open);if(!open)stickerPanel.classList.remove('open')}moreBtn.onclick=e=>{e.stopPropagation();setMore(!morePanel.classList.contains('open'))};morePanel.onclick=e=>e.stopPropagation();const composer=document.querySelector('.composer');composer.addEventListener('click',e=>e.stopPropagation());document.addEventListener('click',()=>setMore(false));
$$('.more-item').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='image')imageInput.click();if(a==='file')fileInput.click();if(a==='sticker')stickerPanel.classList.toggle('open');if(a==='voice')toggleVoice()});
const stickers=['🥺','૮ ˶ᵔ ᵕ ᵔ˶ ა','(๑•̀ㅂ•́)و✧','QAQ','ouo','♡','🐑','🍋'];stickers.forEach(s=>{const b=document.createElement('button');b.className='sticker';b.textContent=s;b.onclick=()=>{pushMessage({type:'sticker',text:s});setMore(false)};stickerPanel.appendChild(b)});
function readImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}imageInput.onchange=async()=>{const f=imageInput.files[0];if(!f)return;const data=await readImage(f);pushMessage({type:'image',data});imageInput.value='';setMore(false)};fileInput.onchange=()=>{const f=fileInput.files[0];if(!f)return;pushMessage({type:'file',name:f.name,size:f.size<1024?f.size+' B':(f.size/1024).toFixed(1)+' KB'});fileInput.value='';setMore(false)};
function toggleVoice(){const b=document.querySelector('[data-action="voice"]');if(!recordStart){recordStart=Date.now();b.closest('.composer').classList.add('recording');voiceLabel.textContent='停止';recordTimer=setInterval(()=>{voiceLabel.textContent=Math.max(1,Math.floor((Date.now()-recordStart)/1000))+'s'},500)}else{const seconds=Math.max(1,Math.round((Date.now()-recordStart)/1000));clearInterval(recordTimer);recordTimer=null;recordStart=0;b.closest('.composer').classList.remove('recording');voiceLabel.textContent='语音';pushMessage({type:'voice',seconds});setMore(false)}}
function openAgent(k){currentAgentKey=k;pendingAvatar=agents[k].avatar||'';agentName.value=agents[k].name;agentStatus.value=agents[k].status;renderAvatar();toolbox(false);agentDialog.showModal()}function renderAvatar(){avatarPreview.innerHTML='';avatarPreview.appendChild(pendingAvatar?Object.assign(document.createElement('img'),{src:pendingAvatar}):avatar(currentAgentKey))}avatarFile.onchange=async()=>{const f=avatarFile.files[0];if(f)pendingAvatar=await readImage(f);renderAvatar()};resetAvatar.onclick=()=>{pendingAvatar='';renderAvatar()};saveAgent.onclick=()=>{agents[currentAgentKey].name=agentName.value.trim()||agents[currentAgentKey].name;agents[currentAgentKey].status=agentStatus.value;agents[currentAgentKey].avatar=pendingAvatar;save();agentDialog.close();renderToolbox()};
geminiQuick.onclick=()=>{toolbox(false);geminiKey.value=sessionStorage.getItem('chaosheng-gemini-key-preview')||'';geminiModel.value=gemini.model;geminiEndpoint.value=gemini.endpoint;apiDialog.showModal()};saveGemini.onclick=()=>{gemini.model=geminiModel.value.trim();gemini.endpoint=geminiEndpoint.value.trim();sessionStorage.setItem('chaosheng-gemini-key-preview',geminiKey.value.trim());save();apiDialog.close();renderToolbox();toast('收好了')};
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close+'Dialog').close());renderToolbox();
</script>
</body>
</html>
