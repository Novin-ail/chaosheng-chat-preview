<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f1ed">
<title>潮生 · Studio</title>
<style>
:root{--ink:#615753;--soft:#9b8f89;--line:rgba(106,86,78,.075);--paper:rgba(255,252,248,.84);--rose:#c98e9b;--rosebg:#f3e3e7;--sage:#9daf9c;--sagebg:#e8efe6;--blue:#9caebe;--bluebg:#e8eef2;--lemon:#c8b982;--lemonbg:#f3efdd;--shadow:0 10px 30px rgba(73,57,50,.045)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#eee5df;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{border:0;cursor:pointer}.app{width:100%;max-width:520px;min-height:100dvh;margin:auto;background-color:#fbf6f2;background-image:linear-gradient(rgba(255,250,247,.77),rgba(255,250,247,.75)),url('assets/dear-lamb-bg-v2.svg');background-size:cover;background-position:center;overflow:hidden}.topbar{height:calc(61px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;position:sticky;top:0;z-index:30;background:rgba(251,246,242,.78);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);border-bottom:1px solid rgba(108,87,79,.045)}.back{width:38px;height:38px;border-radius:50%;background:rgba(255,252,248,.78);display:grid;place-items:center}.back svg{width:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.heading{text-align:center}.heading strong{display:block;font-size:15px;letter-spacing:.08em}.heading small{display:block;margin-top:5px;font-size:7px;color:var(--soft);letter-spacing:.13em}.star{justify-self:end;font:17px Georgia,serif;color:#b4939b}.tabs{position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:25;margin:0 15px;padding:9px 0 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:linear-gradient(to bottom,rgba(251,246,242,.98) 74%,rgba(251,246,242,0))}.tab{height:37px;border-radius:12px 4px 12px 12px;background:rgba(255,252,248,.58);color:#9a8e88;font-size:7.5px;letter-spacing:.13em}.tab.active{background:rgba(239,224,227,.8);color:#7d6269}.view{display:none;padding:5px 15px calc(env(safe-area-inset-bottom) + 25px)}.view.active{display:block}
/* work */
.work-head{display:flex;align-items:center;justify-content:space-between;margin:9px 2px 11px}.work-head strong{font-size:17px}.work-head small{display:block;margin-top:4px;color:var(--soft);font-size:7px}.add{height:34px;padding:0 11px;border-radius:11px 4px 11px 11px;background:rgba(239,224,227,.78);color:#89666f;font-size:8px}.lanes{display:flex;flex-direction:column;gap:13px}.lane-head{display:flex;align-items:center;gap:7px;margin:0 2px 7px}.lane-head b{font-size:8px;letter-spacing:.08em}.lane-head span{font-size:6px;color:#aaa09a}.lane-head::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(122,101,92,.08),transparent)}.cards{display:flex;flex-direction:column;gap:7px}.task{display:grid;grid-template-columns:25px 1fr auto;gap:9px;align-items:center;padding:11px 10px;border:1px solid var(--line);border-radius:15px 5px 15px 15px;background:var(--paper);box-shadow:var(--shadow)}.check{width:22px;height:22px;border-radius:8px 3px 8px 8px;background:#f1ebe5;display:grid;place-items:center;color:#8f817a;font-size:10px}.task.done{opacity:.55}.task.done .task-title{text-decoration:line-through}.task-title{font-size:10px;font-weight:620;line-height:1.45}.task-meta{display:flex;gap:5px;margin-top:5px;align-items:center;font-size:6px;color:var(--soft)}.owner{padding:3px 6px;border-radius:7px;background:#f0e9e3}.task-menu{width:28px;height:28px;border-radius:9px;background:transparent;color:#a0958f}.empty{padding:20px 12px;border:1px dashed rgba(117,96,87,.09);border-radius:15px 5px 15px 15px;text-align:center;color:#aaa09a;font-size:7px}
/* chat */
.chat-top{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 11px}.chat-top strong{font-size:13px}.chat-top small{display:block;margin-top:4px;color:var(--soft);font-size:6.5px}.member-stack{display:flex}.mini{width:26px;height:26px;margin-left:-5px;border-radius:50%;border:2px solid #fbf6f2;display:grid;place-items:center;font-size:6px;font-weight:700}.mini:first-child{margin-left:0}.mini.sheng{background:var(--rosebg);color:#966c76}.mini.roche{background:var(--bluebg);color:#738797}.mini.lemoni{background:var(--lemonbg);color:#8d8051}.mini.me{background:var(--sagebg);color:#728672}.messages{display:flex;flex-direction:column;gap:12px;min-height:430px;padding:2px 0 12px}.msg{display:flex;gap:8px;align-items:flex-start}.msg.me{justify-content:flex-end}.avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;font-size:6px;font-weight:700}.msg.sheng .avatar{background:var(--rosebg);color:#936b75}.msg.roche .avatar{background:var(--bluebg);color:#748697}.msg.lemoni .avatar{background:var(--lemonbg);color:#8a7d50}.msg.me .avatar{display:none}.wrap{max-width:79%}.who{display:block;margin:0 0 4px 3px;font-size:6px;color:#a0958f}.bubble{padding:10px 11px;border-radius:5px 14px 14px 14px;background:rgba(255,252,248,.84);font-size:9px;line-height:1.65;box-shadow:0 5px 15px rgba(77,59,51,.025)}.msg.sheng .bubble{background:rgba(245,230,234,.78)}.msg.roche .bubble{background:rgba(232,238,243,.82)}.msg.lemoni .bubble{background:rgba(244,240,221,.84)}.msg.me .bubble{border-radius:14px 5px 14px 14px;background:rgba(231,239,229,.88)}.msg.me .who{text-align:right;margin-right:3px}.time{margin:4px 3px 0;font-size:5.5px;color:#b2a7a1}.msg.me .time{text-align:right}.composer{position:sticky;bottom:0;padding:9px 0 calc(env(safe-area-inset-bottom) + 5px);background:linear-gradient(to top,rgba(251,246,242,.99) 70%,rgba(251,246,242,0))}.mentions{display:flex;gap:5px;overflow:auto;padding:0 1px 7px;scrollbar-width:none}.mentions::-webkit-scrollbar{display:none}.mention{height:26px;padding:0 9px;border-radius:9px 3px 9px 9px;background:rgba(242,234,230,.86);font-size:7px;white-space:nowrap}.compose{display:grid;grid-template-columns:1fr 42px;gap:7px;align-items:end}.compose textarea{width:100%;min-height:43px;max-height:110px;resize:none;border:1px solid var(--line);border-radius:15px 5px 15px 15px;background:rgba(255,252,248,.92);padding:12px;outline:none;font-size:10px;line-height:1.5}.send{width:42px;height:42px;border-radius:14px 5px 14px 14px;background:#6e625d;color:white;display:grid;place-items:center}.send svg{width:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* status */
.status-list{display:flex;flex-direction:column;gap:9px;margin-top:9px}.agent{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;padding:13px 12px;border:1px solid var(--line);border-radius:17px 6px 17px 17px;background:var(--paper);box-shadow:var(--shadow)}.agent-icon{width:42px;height:42px;border-radius:14px 5px 14px 14px;display:grid;place-items:center;font-size:9px;font-weight:700}.agent.sheng .agent-icon{background:var(--rosebg);color:#936b75}.agent.roche .agent-icon{background:var(--bluebg);color:#748697}.agent.lemoni .agent-icon{background:var(--lemonbg);color:#897c4e}.agent strong{font-size:11px}.agent small{display:block;margin-top:4px;color:var(--soft);font-size:6.5px}.agent-note{margin-top:6px;font-size:7px;color:#887b75}.state{display:flex;align-items:center;gap:5px;font-size:6.5px;color:#897d77}.dot{width:7px;height:7px;border-radius:50%;background:#a8aaa4}.state.online .dot{background:#97ad98}.state.busy .dot{background:#c98f9b}.state.offline .dot{background:#b8b0aa}.edit-note{margin-top:12px;width:100%;height:34px;border-radius:11px 4px 11px 11px;background:rgba(244,236,231,.78);font-size:7px;color:#8b7d77}.status-foot{margin:14px 2px 0;font-size:6px;color:#aaa09a;text-align:center}
/* dialogs */
dialog{width:calc(100% - 30px);max-width:470px;border:1px solid rgba(105,85,77,.07);border-radius:20px 7px 20px 20px;background:#fffaf6;color:var(--ink);padding:0;box-shadow:0 22px 70px rgba(67,52,46,.18)}dialog::backdrop{background:rgba(68,57,52,.18);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.sheet{padding:16px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet-head strong{font-size:11px}.close{width:31px;height:31px;border-radius:10px;background:#f1e6e2;font-size:17px}.field{width:100%;height:41px;border:1px solid var(--line);background:#faf4ef;border-radius:12px 5px 12px 12px;padding:0 11px;outline:none;font-size:10px;margin-top:7px}.sheet-actions{display:flex;justify-content:flex-end;margin-top:10px}.sheet-actions button{height:34px;padding:0 12px;border-radius:10px 4px 10px 10px;background:#ead9de;color:#86656e;font-size:8px}.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:100;transform:translate(-50%,8px);padding:8px 11px;border-radius:10px 4px 10px 10px;background:rgba(65,55,50,.88);color:white;font-size:7px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:370px){.view{padding-left:12px;padding-right:12px}.tabs{margin-left:12px;margin-right:12px}.messages{min-height:370px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
<button class="back" type="button" onclick="location.href='index.html'" aria-label="返回 Chat"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
<div class="heading"><strong>Studio</strong><small>WORK · CHAT · STATUS</small></div><div class="star">✦</div>
</header>
<nav class="tabs"><button class="tab active" data-view="work">WORK</button><button class="tab" data-view="chat">CHAT</button><button class="tab" data-view="status">STATUS</button></nav>
<section class="view active" id="workView">
<div class="work-head"><div><strong>工作台</strong><small id="taskCount">0 个任务</small></div><button class="add" id="addTask">＋ 新任务</button></div>
<div class="lanes">
<section><div class="lane-head"><b>NOW</b><span>正在做</span></div><div class="cards" id="nowList"></div></section>
<section><div class="lane-head"><b>NEXT</b><span>接下来</span></div><div class="cards" id="nextList"></div></section>
<section><div class="lane-head"><b>DONE</b><span>完成</span></div><div class="cards" id="doneList"></div></section>
</div>
</section>
<section class="view" id="chatView">
<div class="chat-top"><div><strong>工作群</strong><small>小漾 · 潮生 · Roche · Lemoni</small></div><div class="member-stack"><span class="mini me">漾</span><span class="mini sheng" data-agent-mini="sheng">潮</span><span class="mini roche" data-agent-mini="roche">R</span><span class="mini lemoni" data-agent-mini="lemoni">L</span></div></div>
<div class="messages" id="messages"></div>
<div class="composer"><div class="mentions"><button class="mention" data-mention="sheng">@潮生</button><button class="mention" data-mention="roche">@Roche</button><button class="mention" data-mention="lemoni">@Lemoni</button><button class="mention" data-mention="all">@全员</button></div><div class="compose"><textarea id="chatInput" rows="1" placeholder="说点什么…"></textarea><button class="send" id="chatSend" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>
</section>
<section class="view" id="statusView">
<div class="status-list" id="statusList"></div><div class="status-foot">tap 名字，可以改备注</div>
</section>
</main>
<dialog id="taskDialog"><div class="sheet"><div class="sheet-head"><strong>新任务</strong><button class="close" data-close="task">×</button></div><input class="field" id="taskTitle" placeholder="任务内容"><select class="field" id="taskOwner"><option value="me">小漾</option><option value="sheng">潮生</option><option value="roche">Roche</option><option value="lemoni">Lemoni</option></select><select class="field" id="taskStage"><option value="now">NOW</option><option value="next">NEXT</option></select><div class="sheet-actions"><button id="saveTask">放进去</button></div></div></dialog>
<dialog id="renameDialog"><div class="sheet"><div class="sheet-head"><strong>改备注</strong><button class="close" data-close="rename">×</button></div><input class="field" id="renameInput" maxlength="20"><div class="sheet-actions"><button id="saveRename">保存</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const defaults={sheng:{name:'潮生',engine:'CC',mode:'server',status:'online',note:'声声'},roche:{name:'Roche',engine:'Codex',mode:'server',status:'online',note:'哥哥'},lemoni:{name:'Lemoni',engine:'Gemini',mode:'API',status:'offline',note:''}};
let agents=(()=>{try{return Object.assign({},defaults,JSON.parse(localStorage.getItem('chaosheng-studio-agents-v2'))||{})}catch(e){return JSON.parse(JSON.stringify(defaults))}})();
Object.keys(defaults).forEach(k=>agents[k]=Object.assign({},defaults[k],agents[k]||{}));
let tasks=(()=>{try{return JSON.parse(localStorage.getItem('chaosheng-studio-tasks-v2'))||[{id:'t1',title:'工作室页面',owner:'roche',stage:'now'},{id:'t2',title:'接入真实状态',owner:'sheng',stage:'next'},{id:'t3',title:'群聊联调',owner:'lemoni',stage:'next'}]}catch(e){return []}})();
let chat=(()=>{try{return JSON.parse(localStorage.getItem('chaosheng-studio-chat-v2'))||[{who:'sheng',text:'工作室这边我在。',time:'16:31'},{who:'roche',text:'我也在，先把页面做顺手。',time:'16:32'},{who:'lemoni',text:'等 API 接好以后我就进群。',time:'16:32'}]}catch(e){return []}})();
let renameKey=null;
function saveAgents(){localStorage.setItem('chaosheng-studio-agents-v2',JSON.stringify(agents))}function saveTasks(){localStorage.setItem('chaosheng-studio-tasks-v2',JSON.stringify(tasks))}function saveChat(){localStorage.setItem('chaosheng-studio-chat-v2',JSON.stringify(chat))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),1100)}
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view+'View').classList.add('active')});
function ownerName(k){return k==='me'?'小漾':agents[k]?.name||k}
function renderTasks(){const map={now:$('#nowList'),next:$('#nextList'),done:$('#doneList')};Object.values(map).forEach(x=>x.innerHTML='');tasks.forEach(t=>{const el=document.createElement('article');el.className='task'+(t.stage==='done'?' done':'');el.innerHTML=`<button class="check" aria-label="切换完成">${t.stage==='done'?'✓':'○'}</button><div><div class="task-title"></div><div class="task-meta"><span class="owner"></span></div></div><button class="task-menu" aria-label="删除">×</button>`;el.querySelector('.task-title').textContent=t.title;el.querySelector('.owner').textContent=ownerName(t.owner);el.querySelector('.check').onclick=()=>{t.stage=t.stage==='done'?'now':'done';saveTasks();renderTasks()};el.querySelector('.task-menu').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);saveTasks();renderTasks()};map[t.stage].appendChild(el)});Object.entries(map).forEach(([k,box])=>{if(!box.children.length)box.innerHTML='<div class="empty">这里空着</div>'});$('#taskCount').textContent=tasks.length+' 个任务'}
$('#addTask').onclick=()=>{$('#taskTitle').value='';$('#taskOwner').innerHTML='<option value="me">小漾</option>'+Object.keys(agents).map(k=>`<option value="${k}">${agents[k].name}</option>`).join('');$('#taskDialog').showModal()};$('#saveTask').onclick=()=>{const title=$('#taskTitle').value.trim();if(!title)return;tasks.unshift({id:'t'+Date.now(),title,owner:$('#taskOwner').value,stage:$('#taskStage').value});saveTasks();renderTasks();$('#taskDialog').close()};
function renderStatus(){const box=$('#statusList');box.innerHTML='';[['sheng','潮'],['roche','R'],['lemoni','L']].forEach(([k,mark])=>{const a=agents[k],el=document.createElement('article');el.className='agent '+k;el.innerHTML=`<div class="agent-icon">${mark}</div><div><button class="agent-name" style="padding:0;background:transparent;text-align:left"><strong></strong><small></small></button><div class="agent-note"></div></div><div class="state ${a.status}"><i class="dot"></i><span></span></div>`;el.querySelector('strong').textContent=a.name;el.querySelector('small').textContent=`${a.engine} · ${a.mode}`;el.querySelector('.agent-note').textContent=a.note||' ';el.querySelector('.state span').textContent=a.status==='online'?'在线':a.status==='busy'?'忙碌':'离线';el.querySelector('.agent-name').onclick=()=>openRename(k);box.appendChild(el)});$$('[data-agent-mini]').forEach(m=>{const a=agents[m.dataset.agentMini];m.textContent=a.name.slice(0,1)});$$('.mention').forEach(m=>{const k=m.dataset.mention;if(k!=='all')m.textContent='@'+agents[k].name});renderTasks();renderChat()}
function openRename(k){renameKey=k;$('#renameInput').value=agents[k].name;$('#renameDialog').showModal();setTimeout(()=>$('#renameInput').select(),20)}$('#saveRename').onclick=()=>{const v=$('#renameInput').value.trim();if(!v||!renameKey)return;agents[renameKey].name=v;saveAgents();$('#renameDialog').close();renderStatus();toast('改好了')};
function renderChat(){const box=$('#messages');box.innerHTML='';chat.forEach(m=>{const el=document.createElement('article');el.className='msg '+(m.who==='me'?'me':m.who);if(m.who==='me'){el.innerHTML='<div class="wrap"><span class="who">小漾</span><div class="bubble"></div><div class="time"></div></div>'}else{const mark=m.who==='sheng'?'潮':m.who==='roche'?'R':'L';el.innerHTML=`<div class="avatar">${mark}</div><div class="wrap"><span class="who"></span><div class="bubble"></div><div class="time"></div></div>`;el.querySelector('.who').textContent=agents[m.who]?.name||m.who}el.querySelector('.bubble').textContent=m.text;el.querySelector('.time').textContent=m.time||'';box.appendChild(el)});if($('#chatView').classList.contains('active'))requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}
function send(){const i=$('#chatInput'),v=i.value.trim();if(!v)return;chat.push({who:'me',text:v,time:now()});saveChat();i.value='';renderChat()}$('#chatSend').onclick=send;$('#chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$$('.mention').forEach(b=>b.onclick=()=>{const key=b.dataset.mention,name=key==='all'?'全员':agents[key].name,i=$('#chatInput');i.value=(i.value?i.value+' ':'')+'@'+name+' ';i.focus()});
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close+'Dialog').close());renderStatus();
</script>
</body>
</html>
