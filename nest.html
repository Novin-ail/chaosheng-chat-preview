ton{height:33px;border:0;border-radius:9px;padding:0 9px;background:rgba(239,226,229,.76)}.detail-actions{display:flex;gap:6px;margin-top:11px}.detail-actions .archive{margin-left:auto}.archive-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.archive-label{min-height:128px;border:0;border-radius:7px;background:#fff2f1;padding:20px 8px 10px}.archive-empty{grid-column:1/-1;padding:48px 10px;text-align:center}.toast{position:fixed;z-index:120;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,8px);padding:7px 10px;border-radius:10px;background:rgba(55,47,43,.84);color:white;font-size:8px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<main class="home"><button class="back" type="button" onclick="location.href='index.html'" aria-label="回到聊天"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button><section class="room-scroll"><div class="room-date" id="roomDate"></div><section class="room-top"><div class="room-left-reserve"><button class="cat-home-placeholder" id="catBtn" type="button" aria-label="猫窝"></button></div><section class="wall"><img class="cat-wall-bg" src="https://files.catbox.moe/eyt5q8.png" alt=""><div class="wall-top"><div class="wall-actions"><button class="wall-action font" id="fontBtn" type="button">Aa</button><button class="wall-action box" id="noteBoxBtn" type="button"><svg viewBox="0 0 24 24"><path d="M5 8h14v11H5zM8 8V5h8v3"></path></svg></button><button class="wall-action" id="wallAdd" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button></div></div><div class="notes-board" id="notesBoard"></div></section></section><section class="room-bottom"><article class="corner water-corner"><div class="water-head"><div><div class="corner-label">今天的水</div><div class="corner-note" id="waterNote">这一杯还在等你</div></div><span class="water-count" id="waterCount">0 / 8</span></div><button class="cup-btn" id="cupBtn" type="button"><svg class="tumbler-straw" viewBox="0 0 70 116"><path d="M22 102 L31 27 Q32.5 15 43 13 H56"></path></svg><span class="tumbler-lid"></span><span class="cup"><span class="water"></span></span><img class="sheep-sticker" src="https://files.catbox.moe/j45hyg.png" alt=""><span class="cup-status" id="cupStatus">喝掉这一杯</span></button><div class="eight" id="eight"></div></article><button class="object snack-home" id="snackBtn" type="button"><span class="snack-box"></span><b>零食架</b></button></section><section class="room-after"><button class="record-home" id="recordBtn" type="button"><span class="vinyl-stage"><span class="vinyl-disc"></span><span class="vinyl-shine"></span><span class="needle-arm"></span><span class="needle-pivot"></span></span></button><div></div></section><div class="home-end"><i>♡</i><span>we live here</span><i>✦</i></div></section><div class="overlay" id="noteOverlay"><section class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div><strong>小漾的标签</strong><small>声声的标签只让声声自己贴。</small></div><button class="sheet-close" id="noteClose">×</button></div><textarea class="note-input" id="noteInput" maxlength="120"></textarea><div class="sheet-foot"><button id="saveNote">贴上去</button></div></section></div><div class="overlay note-viewer" id="noteViewer"><article class="label-detail" id="labelDetail" onclick="event.stopPropagation()"><div class="detail-top"><span id="detailWho"></span><span id="detailTime"></span><span class="detail-boxmark" id="detailBoxmark"></span></div><div class="detail-text" id="detailText"></div><div class="reply-rule">COMMENTS</div><div class="reply-list" id="replyList"></div><div class="reply-add"><input id="replyInput"><button id="replySend">回复</button></div><div class="detail-actions"><button id="detailClose">放回墙上</button><button class="archive" id="archiveNote">取下</button></div></article></div><div class="overlay" id="noteBoxOverlay"><section class="box-sheet" onclick="event.stopPropagation()"><div class="sheet-head"><strong>标签箱</strong><button class="sheet-close" id="noteBoxClose">×</button></div><div class="archive-list" id="archiveList"></div></section></div><input id="fontPicker" type="file" hidden><div class="toast" id="toast"></div></main>
<script>
const $=s=>document.querySelector(s),NOTE_STORE='chaosheng-home-wall-v1',WATER_STORE='chaosheng-home-water-v1';let notes=(()=>{try{return JSON.parse(localStorage.getItem(NOTE_STORE))||[]}catch(e){return[]}})();let activeNoteId=null;const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};let water=(()=>{try{const v=JSON.parse(localStorage.getItem(WATER_STORE))||{};return v.date===todayKey()?v:{date:todayKey(),count:0,emptyUntil:0}}catch(e){return{date:todayKey(),count:0,emptyUntil:0}}})();function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]))}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)}function persistNotes(){localStorage.setItem(NOTE_STORE,JSON.stringify(notes))}function renderNotes(){const b=$('#notesBoard');b.innerHTML='';notes.filter(n=>!n.archived).slice(-4).forEach((n,i)=>{const x=document.createElement('button');x.className='label-strip '+(n.who||'yang');x.innerHTML=`<small>${esc(n.time||'')}</small><p>${esc(n.text||'')}</p><span class="who">${n.who==='sheng'?'声声':'小漾'}</span>`;x.style.left=(i%2?54:5)+'%';x.style.top=(i<2?10:52)+'%';x.onclick=()=>openNote(n.id);b.appendChild(x)})}function openNote(id){activeNoteId=id;const n=notes.find(x=>x.id===id);if(!n)return;$('#detailWho').textContent=n.who==='sheng'?'声声':'小漾';$('#detailTime').textContent=n.time||'';$('#detailText').textContent=n.text||'';$('#noteViewer').classList.add('show')}$('#detailClose').onclick=()=>$('#noteViewer').classList.remove('show');$('#noteViewer').onclick=()=>$('#noteViewer').classList.remove('show');$('#wallAdd').onclick=()=>$('#noteOverlay').classList.add('show');$('#noteClose').onclick=()=>$('#noteOverlay').classList.remove('show');$('#noteOverlay').onclick=()=>$('#noteOverlay').classList.remove('show');$('#saveNote').onclick=()=>{const t=$('#noteInput').value.trim();if(!t)return;notes.push({id:'u'+Date.now(),who:'yang',text:t,time:new Date().toTimeString().slice(0,5),archived:false});persistNotes();$('#noteInput').value='';$('#noteOverlay').classList.remove('show');renderNotes()};$('#noteBoxBtn').onclick=()=>{$('#noteBoxOverlay').classList.add('show')};$('#noteBoxClose').onclick=()=>$('#noteBoxOverlay').classList.remove('show');function persistWater(){localStorage.setItem(WATER_STORE,JSON.stringify(water))}function renderWater(){const c=Math.min(8,water.count||0),empty=Date.now()<water.emptyUntil;$('#waterCount').textContent=`${c} / 8`;$('#cupBtn').classList.toggle('empty',empty||c>=8);$('#cupStatus').textContent=c>=8?'今天喝满啦':empty?'等下一杯':'喝掉这一杯';$('#waterNote').textContent=c>=8?'八杯都喝完了':empty?'下一杯正在慢慢装满':'这一杯还在等你';const d=$('#eight');d.innerHTML='';for(let i=0;i<8;i++){const x=document.createElement('i');if(i<c)x.className='done';d.appendChild(x)}}$('#cupBtn').onclick=()=>{if(Date.now()<water.emptyUntil||water.count>=8)return;water.count++;water.emptyUntil=Date.now()+3600000;persistWater();renderWater()};$('#snackBtn').onclick=()=>location.href='snacks.html';$('#recordBtn').onclick=()=>toast('唱片机 · 下一间慢慢做');$('#catBtn').onclick=()=>toast('猫窝 · 等小猫搬进来');const d=new Date(),months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];$('#roomDate').textContent=`${months[d.getMonth()]} · ${String(d.getDate()).padStart(2,'0')} · home`;renderNotes();renderWater();
</script></body></html>
