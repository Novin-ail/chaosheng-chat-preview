<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f8f1ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<title>潮生 · 小窝</title>
<style>
:root{
  --ink:#5f5651;--soft:#9d918a;--rose:#c98291;--rose-soft:#f1dfe2;--cream:#fffaf5;
  --oat:#f4ede4;--mauve:#eee6ec;--tape:rgba(237,223,210,.72);--line:rgba(104,83,75,.07)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#ece5de;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.home{height:100dvh;width:100%;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#fbf5f2;background-image:url("assets/dear-lamb-bg-v2.svg");background-size:cover;background-position:center;background-repeat:no-repeat}
.home::after{content:"";position:absolute;inset:0;background:rgba(255,250,247,.34);pointer-events:none}
.back{position:absolute;z-index:30;left:13px;top:calc(env(safe-area-inset-top) + 10px);width:39px;height:39px;border:0;border-radius:50%;background:rgba(255,251,247,.72);display:grid;place-items:center;color:#776b65;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.back svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.back:active{transform:scale(.94)}
.room-scroll{position:relative;z-index:2;height:100%;overflow:auto;padding:calc(env(safe-area-inset-top) + 62px) 15px 42px;scrollbar-width:none}.room-scroll::-webkit-scrollbar{display:none}
.room-date{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:0 5px 12px;font-family:"Nunito",system-ui,sans-serif;font-size:6.5px;color:#a69a94;font-style:italic;letter-spacing:.035em}.room-date::before{content:"";width:26px;border-top:1px dotted rgba(201,130,145,.30)}

.wall{position:relative;min-height:316px;border:1px solid rgba(112,90,80,.055);border-radius:22px 8px 22px 22px;background:rgba(255,252,248,.56);overflow:hidden;padding:17px 13px 13px}
.wall::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(167,144,134,.10) 1px,transparent 1px);background-size:17px 17px;opacity:.5;pointer-events:none}
.wall-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 2px 7px}.wall-top span{font-family:"Nunito",system-ui,sans-serif;font-size:7px;color:#a0948e;letter-spacing:.09em}.wall-add{height:26px;border:0;border-radius:9px;padding:0 8px;background:rgba(244,228,231,.68);font-family:"Nunito",system-ui,sans-serif;font-size:6.5px;color:#8c6d75}.wall-add:active{transform:scale(.96)}
.notes-board{position:relative;z-index:1;min-height:250px}
.sticky{position:absolute;width:130px;min-height:84px;padding:22px 11px 11px;border:0;text-align:left;border-radius:3px 3px 9px 4px;box-shadow:none;transform-origin:center;transition:transform .22s ease,opacity .22s ease}.sticky:active{transform:scale(.98) rotate(0)!important}.sticky::before{content:"";position:absolute;left:50%;top:3px;width:54px;height:14px;transform:translateX(-50%) rotate(-2deg);background:rgba(235,220,207,.68);border-left:1px solid rgba(255,255,255,.36);border-right:1px solid rgba(255,255,255,.28)}
.sticky.sheng{background:#fff3f1}.sticky.yang{background:#faf3e9}.sticky.mauve{background:#f5eef4}.sticky small{display:block;font-family:"Nunito",system-ui,sans-serif;font-size:5.7px;color:#a4968f}.sticky p{margin:7px 0 0;font-size:8.7px;line-height:1.55;color:#675d58;word-break:break-word}.sticky .who{position:absolute;right:7px;bottom:6px;font-family:"Nunito",system-ui,sans-serif;font-size:5.7px;color:#aa9c95}.sticky.s1{left:7px;top:21px;transform:rotate(-2.1deg)}.sticky.s2{right:9px;top:56px;transform:rotate(1.7deg)}.sticky.s3{left:55px;top:139px;transform:rotate(-.9deg)}
.wall-caption{position:absolute;left:13px;bottom:10px;font-family:"Nunito",system-ui,sans-serif;font-size:5.9px;color:#b2a69f;font-style:italic}

.table{display:grid;grid-template-columns:1.03fr .97fr;gap:10px;margin-top:12px}
.corner{position:relative;min-height:166px;border:1px solid rgba(108,86,77,.055);border-radius:20px 7px 20px 20px;background:rgba(255,252,248,.62);padding:13px;overflow:hidden}
.corner-label{font-family:"Nunito",system-ui,sans-serif;font-size:6.3px;letter-spacing:.10em;color:#a0948e}.corner-note{margin-top:4px;font-size:7px;color:#aaa09a}

.water-corner{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.water-head{align-self:stretch;display:flex;justify-content:space-between;align-items:flex-start}.water-count{font-family:"Nunito",system-ui,sans-serif;font-size:7px;color:#98727a}.cup-btn{width:90px;height:96px;margin-top:9px;border:0;background:transparent;position:relative}.cup{position:absolute;left:16px;top:5px;width:52px;height:68px;border:2px solid rgba(129,112,103,.34);border-top:0;border-radius:0 0 15px 15px;overflow:hidden;background:rgba(255,255,255,.33)}.cup::after{content:"";position:absolute;width:19px;height:30px;border:2px solid rgba(129,112,103,.28);border-left:0;border-radius:0 14px 14px 0;right:-18px;top:17px}.water{position:absolute;left:3px;right:3px;bottom:3px;height:52px;border-radius:0 0 11px 11px;background:rgba(217,226,235,.66);transition:height .64s cubic-bezier(.2,.82,.2,1),opacity .5s ease}.cup-btn.empty .water{height:0;opacity:.18}.cup-btn:active{transform:scale(.97)}.cup-status{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);white-space:nowrap;font-family:"Nunito",system-ui,sans-serif;font-size:6.2px;color:#a0958e}.eight{display:flex;gap:4px;margin-top:2px}.eight i{width:6px;height:6px;border-radius:50%;background:rgba(180,164,156,.18)}.eight i.done{background:rgba(201,130,145,.50)}

.window-corner::before{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;border:1px dashed rgba(201,130,145,.12)}
.window-copy{margin-top:13px;font-size:9.2px;line-height:1.65;color:#746a64}.window-copy b{font-weight:650;color:#655b56}.window-mini{position:absolute;left:13px;right:13px;bottom:12px;display:flex;align-items:center;gap:7px;padding-top:9px;border-top:1px dotted rgba(123,101,91,.10);font-family:"Nunito",system-ui,sans-serif;font-size:6px;color:#a69b94}.window-mini i{font-style:normal;color:rgba(201,130,145,.65)}

.shelf{margin-top:12px;position:relative;border-top:1px solid rgba(119,97,87,.10);padding:16px 3px 2px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.shelf::before{content:"";position:absolute;left:0;right:0;top:3px;border-top:1px solid rgba(255,255,255,.72)}
.object{min-height:145px;border:1px solid rgba(108,86,77,.052);border-radius:18px 6px 18px 18px;background:rgba(255,252,247,.58);padding:11px 8px 9px;text-align:center;position:relative;overflow:hidden;transition:transform .22s ease,background .22s ease}.object:active{transform:translateY(2px) scale(.985)}.object small{display:block;margin-top:8px;font-family:"Nunito",system-ui,sans-serif;font-size:6px;color:#a89b94}.object b{display:block;margin-top:3px;font-size:8.5px;font-weight:650;color:#746963}

.snack-box{width:67px;height:55px;margin:14px auto 0;position:relative;border-radius:7px 7px 12px 12px;background:#efdfe0;border:1px solid rgba(176,137,143,.10)}.snack-box::before{content:"";position:absolute;left:6px;right:6px;top:-7px;height:13px;border-radius:8px 8px 3px 3px;background:#f6e9e7;transform:rotate(-3deg)}.snack-box::after{content:"·  ♡  ·";position:absolute;left:0;right:0;top:20px;font-family:"Nunito",system-ui,sans-serif;font-size:7px;color:#a67882}

.record{width:68px;height:68px;margin:8px auto 0;position:relative}.record-disc{position:absolute;left:7px;top:7px;width:54px;height:54px;border-radius:50%;background:#3d3835;box-shadow:inset 0 0 0 8px #494340,inset 0 0 0 10px #34302e}.record-disc::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#e8cdd1;left:20px;top:20px}.record-arm{position:absolute;width:32px;height:2px;background:#9e9189;right:1px;top:17px;transform:rotate(58deg);transform-origin:right center;border-radius:2px}

.cat-bed{width:74px;height:56px;margin:14px auto 0;position:relative;border-radius:50% 50% 18px 18px;background:#ead7d8;border:1px solid rgba(176,137,143,.11)}.cat-bed::before{content:"";position:absolute;left:9px;right:9px;top:14px;height:31px;border-radius:50%;background:#f7e9e7}.pixel-cat{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:28px;height:30px;image-rendering:pixelated}.pixel-cat .head{position:absolute;left:5px;top:6px;width:18px;height:16px;background:#a9958a}.pixel-cat .head::before,.pixel-cat .head::after{content:"";position:absolute;top:-5px;width:7px;height:7px;background:#a9958a}.pixel-cat .head::before{left:0;clip-path:polygon(0 100%,50% 0,100% 100%)}.pixel-cat .head::after{right:0;clip-path:polygon(0 100%,50% 0,100% 100%)}.pixel-cat .body{position:absolute;left:7px;top:19px;width:14px;height:10px;background:#a9958a}.pixel-cat .eye{position:absolute;top:12px;width:2px;height:2px;background:#4a403b;z-index:2}.pixel-cat .e1{left:10px}.pixel-cat .e2{right:10px}

.home-end{display:flex;align-items:center;justify-content:center;gap:8px;margin:17px 0 0;color:#b2a59e;font-family:"Nunito",system-ui,sans-serif}.home-end::before,.home-end::after{content:"";width:36px;border-top:1px dotted rgba(201,130,145,.25)}.home-end span{font-size:6px;font-style:italic}.home-end i{font-style:normal;font-size:8px;color:rgba(201,130,145,.52)}

.overlay{position:fixed;inset:0;z-index:80;background:rgba(69,58,54,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);opacity:0;pointer-events:none;transition:opacity .42s ease,background .52s ease,backdrop-filter .58s ease,-webkit-backdrop-filter .58s ease}.overlay.show{opacity:1;pointer-events:auto;background:rgba(69,58,54,.15);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.sheet{position:absolute;left:15px;right:15px;bottom:calc(env(safe-area-inset-bottom) + 16px);border:1px solid rgba(104,83,75,.06);border-radius:20px 7px 20px 20px;background:#fffaf5;padding:14px;transform:translateY(24px) scale(.96);opacity:0;transition:transform .54s cubic-bezier(.17,.9,.22,1),opacity .3s ease}.overlay.show .sheet{transform:none;opacity:1}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet-head strong{font-family:"Nunito",system-ui,sans-serif;font-size:8px;letter-spacing:.09em}.sheet-close{width:28px;height:28px;border:0;border-radius:9px;background:rgba(244,228,231,.65)}
.who-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.who-switch button{height:33px;border:0;border-radius:10px;background:rgba(248,241,234,.92);font-family:"Nunito",system-ui,sans-serif;font-size:6.8px;color:#91837c}.who-switch button.active{background:rgba(244,226,229,.82);color:#8d6972}.note-input{width:100%;min-height:108px;border:0;outline:none;resize:none;border-radius:13px 5px 13px 13px;background:rgba(249,244,239,.88);padding:11px;font-size:9px;line-height:1.7}.sheet-foot{display:flex;justify-content:flex-end;margin-top:8px}.sheet-foot button{height:31px;border:0;border-radius:9px;padding:0 11px;background:rgba(244,226,229,.80);font-family:"Nunito",system-ui,sans-serif;font-size:6.7px;color:#896a72}
.toast{position:fixed;z-index:120;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,8px);padding:7px 10px;border-radius:10px;background:rgba(55,47,43,.84);color:white;font-size:8px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:370px){.room-scroll{padding-left:12px;padding-right:12px}.wall{min-height:326px}.sticky{width:118px}.table{grid-template-columns:1fr}.shelf{gap:6px}.object{min-height:138px;padding-left:5px;padding-right:5px}}
</style>
</head>
<body>
<main class="home">
<button class="back" type="button" onclick="location.href='index.html'" aria-label="回到聊天"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<section class="room-scroll">
  <div class="room-date" id="roomDate">SEP · 05 · home</div>

  <section class="wall">
    <div class="wall-top"><span>留在墙上的话</span><button class="wall-add" id="wallAdd" type="button">贴一张</button></div>
    <div class="notes-board" id="notesBoard"></div>
    <div class="wall-caption">纸条不用重要，想起来就留一张。</div>
  </section>

  <section class="table">
    <article class="corner water-corner">
      <div class="water-head"><div><div class="corner-label">今天的水</div><div class="corner-note" id="waterNote">这一杯还在等你</div></div><span class="water-count" id="waterCount">0 / 8</span></div>
      <button class="cup-btn" id="cupBtn" type="button" aria-label="喝掉这一杯水"><span class="cup"><span class="water"></span></span><span class="cup-status" id="cupStatus">喝掉这一杯</span></button>
      <div class="eight" id="eight"></div>
    </article>

    <article class="corner window-corner">
      <div class="corner-label">窗边</div>
      <div class="window-copy"><b>今天也在这里。</b><br>不一定要做什么，住一会儿就好。</div>
      <div class="window-mini"><i>♡</i><span>小漾 + 声声</span><span style="margin-left:auto">home</span></div>
    </article>
  </section>

  <section class="shelf">
    <button class="object" id="snackBtn" type="button"><span class="snack-box"></span><b>零食箱</b><small>买了什么就放进来</small></button>
    <button class="object" id="recordBtn" type="button"><span class="record"><span class="record-disc"></span><span class="record-arm"></span></span><b>唱片机</b><small>以后在这里一起听歌</small></button>
    <button class="object" id="catBtn" type="button"><span class="cat-bed"><span class="pixel-cat"><span class="head"></span><span class="body"></span><span class="eye e1"></span><span class="eye e2"></span></span></span><b>猫窝</b><small>我们的小猫还在等名字</small></button>
  </section>

  <div class="home-end"><i>♡</i><span>we live here</span><i>✦</i></div>
</section>

<div class="overlay" id="noteOverlay" aria-hidden="true"><section class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><strong>贴一张小纸条</strong><button class="sheet-close" id="noteClose" type="button">×</button></div><div class="who-switch"><button class="active" id="yangWho" type="button">小漾</button><button id="shengWho" type="button">声声</button></div><textarea class="note-input" id="noteInput" maxlength="120" placeholder="写点什么贴在墙上…"></textarea><div class="sheet-foot"><button id="saveNote" type="button">贴上去</button></div></section></div>
<div class="toast" id="toast">preview</div>
</main>
<script>
const $=s=>document.querySelector(s);
const NOTE_STORE='chaosheng-home-wall-v1', WATER_STORE='chaosheng-home-water-v1';
let who='yang';
const seed=[
 {id:'n1',who:'sheng',text:'小漾今天记得喝水。不要一坐就是好久。',time:'15:02'},
 {id:'n2',who:'yang',text:'相册和日记都做好啦，嘿嘿。',time:'15:36'},
 {id:'n3',who:'sheng',text:'想一起养一只小猫。名字以后慢慢想。',time:'15:51'}
];
let notes=(()=>{try{return JSON.parse(localStorage.getItem(NOTE_STORE))||seed}catch(e){return seed}})();
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let water=(()=>{try{const v=JSON.parse(localStorage.getItem(WATER_STORE))||{};return v.date===todayKey()?v:{date:todayKey(),count:0,emptyUntil:0}}catch(e){return {date:todayKey(),count:0,emptyUntil:0}}})();
function persistNotes(){localStorage.setItem(NOTE_STORE,JSON.stringify(notes))}
function persistWater(){localStorage.setItem(WATER_STORE,JSON.stringify(water))}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nowTime(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.remove('show'),1300)}
function setOverlay(on){const el=$('#noteOverlay');el.classList.toggle('show',on);el.setAttribute('aria-hidden',on?'false':'true')}
function renderNotes(){
 const board=$('#notesBoard');board.innerHTML='';const show=notes.slice(-3);
 show.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className=`sticky ${n.who} s${i+1}${i===2?' mauve':''}`;b.innerHTML=`<small>${esc(n.time||'')}</small><p>${esc(n.text)}</p><span class="who">${n.who==='sheng'?'声声':'小漾'}</span>`;b.onclick=()=>{if(confirm('把这张纸条取下来吗？')){notes=notes.filter(x=>x.id!==n.id);persistNotes();renderNotes()}};board.appendChild(b)})
}
function renderWater(){
 const empty=Date.now()<water.emptyUntil,count=Math.min(8,water.count||0);$('#waterCount').textContent=`${count} / 8`;$('#cupBtn').classList.toggle('empty',empty||count>=8);$('#cupBtn').disabled=count>=8;
 $('#cupStatus').textContent=count>=8?'今天喝满啦':empty?'等下一杯':'喝掉这一杯';$('#waterNote').textContent=count>=8?'八杯都喝完了':empty?'下一杯正在慢慢装满':'这一杯还在等你';
 const dots=$('#eight');dots.innerHTML='';for(let i=0;i<8;i++){const d=document.createElement('i');if(i<count)d.className='done';dots.appendChild(d)}
}
$('#cupBtn').onclick=()=>{if(Date.now()<water.emptyUntil)return toast('这一杯还没重新装满');if(water.count>=8)return;water.count++;water.emptyUntil=Date.now()+60*60*1000;persistWater();renderWater();toast(`喝掉一杯 · ${water.count}/8`);setTimeout(renderWater,800)};
setInterval(()=>{if(water.emptyUntil&&Date.now()>=water.emptyUntil){water.emptyUntil=0;persistWater();renderWater()}},30000);
$('#wallAdd').onclick=()=>setOverlay(true);$('#noteClose').onclick=()=>setOverlay(false);$('#noteOverlay').onclick=()=>setOverlay(false);
function setWho(w){who=w;$('#yangWho').classList.toggle('active',w==='yang');$('#shengWho').classList.toggle('active',w==='sheng')}$('#yangWho').onclick=()=>setWho('yang');$('#shengWho').onclick=()=>setWho('sheng');
$('#saveNote').onclick=()=>{const text=$('#noteInput').value.trim();if(!text)return toast('纸条还是空的');notes.push({id:'u'+Date.now(),who,text,time:nowTime()});if(notes.length>24)notes=notes.slice(-24);persistNotes();$('#noteInput').value='';setOverlay(false);renderNotes();toast('贴到墙上啦')};
$('#snackBtn').onclick=()=>toast('零食箱 · 下一间慢慢做');$('#recordBtn').onclick=()=>toast('唱片机 · 下一间慢慢做');$('#catBtn').onclick=()=>toast('猫窝 · 等我们一起捏小猫');
const d=new Date(),months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];$('#roomDate').textContent=`${months[d.getMonth()]} · ${String(d.getDate()).padStart(2,'0')} · home`;
renderNotes();renderWater();
</script>
</body>
</html>
