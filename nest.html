;background:rgba(239,226,229,.76);font-family:"Nunito",system-ui,sans-serif;font-size:6.5px;color:#8b6c74}.detail-actions{display:flex;align-items:center;gap:6px;margin-top:11px}.detail-actions button{height:30px;border:0;border-radius:9px;padding:0 9px;background:rgba(249,244,238,.86);font-family:"Nunito",system-ui,sans-serif;font-size:6.4px;color:#8b7d76}.detail-actions .archive{margin-left:auto;background:rgba(244,226,229,.74);color:#8b6a72}.detail-actions .archive:disabled{opacity:.5}

<body>
<main class="home">
<button class="back" type="button" onclick="location.href='index.html'" aria-label="回到聊天"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<section class="room-scroll">
<div class="room-date" id="roomDate">SEP · 05 · home</div>
<section class="wall"><div class="wall-top"><span>留在墙上的话</span><div class="wall-actions"><button class="wall-action font" id="fontBtn" type="button" title="装入两个人的手写字体">Aa</button><button class="wall-action box" id="noteBoxBtn" type="button">标签箱</button><button class="wall-action" id="wallAdd" type="button">贴一张</button></div></div><div class="notes-board" id="notesBoard"></div><div class="wall-caption">轻点打开 · 长按标签可以自己摆位置。</div></section>
<section class="table"><article class="corner water-corner"><div class="water-head"><div><div class="corner-label">今天的水</div><div class="corner-note" id="waterNote">这一杯还在等你</div></div><span class="water-count" id="waterCount">0 / 8</span></div><button class="cup-btn" id="cupBtn" type="button" aria-label="喝掉这一杯水"><span class="cup"><span class="water"></span></span><span class="cup-status" id="cupStatus">喝掉这一杯</span></button><div class="eight" id="eight"></div></article><article class="corner window-corner"><div class="corner-label">窗边</div><div class="window-copy"><b>今天也在这里。</b><br>不一定要做什么，住一会儿就好。</div><div class="window-mini"><i>♡</i><span>小漾 + 声声</span><span style="margin-left:auto">home</span></div></article></section>
<section class="shelf"><button class="object" id="snackBtn" type="button"><span class="snack-box"></span><b>零食箱</b><small>买了什么就放进来</small></button><button class="object" id="recordBtn" type="button"><span class="record"><span class="record-disc"></span><span class="record-arm"></span></span><b>唱片机</b><small>以后在这里一起听歌</small></button><button class="object" id="catBtn" type="button"><span class="cat-bed"><span class="pixel-cat"><span class="head"></span><span class="body"></span><span class="eye e1"></span><span class="eye e2"></span></span></span><b>猫窝</b><small>我们的小猫还在等名字</small></button></section>
<div class="home-end"><i>♡</i><span>we live here</span><i>✦</i></div>
</section>
<div class="overlay" id="noteOverlay" aria-hidden="true"><section class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div><strong>小漾的标签</strong><small>声声的标签只让声声自己贴。</small></div><button class="sheet-close" id="noteClose" type="button">×</button></div><textarea class="note-input" id="noteInput" maxlength="120" placeholder="写点什么留给声声…"></textarea><div class="sheet-foot"><button id="saveNote" type="button">贴上去</button></div></section></div>
<div class="overlay note-viewer" id="noteViewer" aria-hidden="true"><article class="label-detail" id="labelDetail" onclick="event.stopPropagation()"><div class="detail-top"><span class="detail-who" id="detailWho"></span><span class="detail-time" id="detailTime"></span><span class="detail-boxmark" id="detailBoxmark"></span></div><div class="detail-text" id="detailText"></div><div class="reply-rule">COMMENTS · 留在这张标签下面</div><div class="reply-list" id="replyList"></div><div class="reply-add"><input id="replyInput" maxlength="80" placeholder="回一句…" autocomplete="off"><button id="replySend" type="button">回复</button></div><div class="detail-actions"><button id="detailClose" type="button">放回去</button><button class="archive" id="archiveNote" type="button">取下 · 放进标签箱</button></div></article></div>
<div class="overlay" id="noteBoxOverlay" aria-hidden="true"><section class="box-sheet" onclick="event.stopPropagation()"><div class="sheet-head"><div><strong>标签箱</strong><small>从墙上取下来的纸条都好好收在这里。</small></div><button class="sheet-close" id="noteBoxClose" type="button">×</button></div><div class="archive-list" id="archiveList"></div><div class="box-caption">旧标签不会消失，评论也会跟着一起留下。</div></section></div>
<input id="fontPicker" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" multiple hidden>
<div class="toast" id="toast">preview</div>
</main>
<script>
const $=s=>document.querySelector(s);const NOTE_STORE='chaosheng-home-wall-v1',WATER_STORE='chaosheng-home-water-v1',FONT_DB='chaosheng-home-private-fonts-v1';
const seed=[{id:'n1',who:'sheng',text:'小漾今天记得喝水。不要一坐就是好久。',time:'15:02',archived:false,comments:[]},{id:'n2',who:'yang',text:'相册和日记都做好啦，嘿嘿。',time:'15:36',archived:false,comments:[]},{id:'n3',who:'sheng',text:'想一起养一只小猫。名字以后慢慢想。',time:'15:51',archived:false,comments:[]}];
let notes=(()=>{try{const raw=JSON.parse(localStorage.getItem(NOTE_STORE));const base=Array.isArray(raw)?raw:seed;return base.map(n=>({...n,archived:!!n.archived,comments:Array.isArray(n.comments)?n.comments:[],pos:n.pos&&Number.isFinite(n.pos.x)&&Number.isFinite(n.pos.y)?n.pos:null}))}catch(e){return seed.map(n=>({...n}))}})();let activeNoteId=null,viewerFromBox=false;const fontState={yang:false,sheng:false};
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let water=(()=>{try{const v=JSON.parse(localStorage.getItem(WATER_STORE))||{};return v.date===todayKey()?v:{date:todayKey(),count:0,emptyUntil:0}}catch(e){return {date:todayKey(),count:0,emptyUntil:0}}})();
function persistNotes(){localStorage.setItem(NOTE_STORE,JSON.stringify(notes))}function persistWater(){localStorage.setItem(WATER_STORE,JSON.stringify(water))}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]))}function nowTime(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.remove('show'),1300)}function setSimpleOverlay(id,on){const el=$(id);el.classList.toggle('show',on);el.setAttribute('aria-hidden',on?'false':'true')}function getNote(id){return notes.find(n=>n.id===id)}function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function defaultSlot(i,board,el){const w=board.clientWidth,h=board.clientHeight,ew=el.offsetWidth;const slots=[{x:12,y:28,r:-2.1},{x:w-ew-12,y:52,r:1.7},{x:Math.round((w-ew)/2)-16,y:148,r:-.9},{x:w-ew-48,y:126,r:.7}];return slots[i%slots.length]}
function attachDrag(el,n,slot,board){let hold=0,drag=false,moved=false,startX=0,startY=0,startLeft=0,startTop=0,pid=null;const cancelHold=()=>{if(hold){clearTimeout(hold);hold=0}};el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pid=e.pointerId;moved=false;startX=e.clientX;startY=e.clientY;startLeft=parseFloat(el.style.left)||0;startTop=parseFloat(el.style.top)||0;cancelHold();hold=setTimeout(()=>{drag=true;el.classList.add('dragging');try{el.setPointerCapture(pid)}catch(_){ }if(navigator.vibrate)navigator.vibrate(18)},330)});el.addEventListener('pointermove',e=>{const dist=Math.hypot(e.clientX-startX,e.clientY-startY);if(!drag&&dist>8){moved=true;cancelHold();return}if(!drag)return;e.preventDefault();moved=true;const maxX=Math.max(0,board.clientWidth-el.offsetWidth),maxY=Math.max(0,board.clientHeight-el.offsetHeight);const x=clamp(startLeft+e.clientX-startX,0,maxX),y=clamp(startTop+e.clientY-startY,0,maxY);el.style.left=x+'px';el.style.top=y+'px'});const end=e=>{cancelHold();if(drag){drag=false;el.classList.remove('dragging');const x=parseFloat(el.style.left)||0,y=parseFloat(el.style.top)||0;n.pos={x,y,r:Number.isFinite(n.pos?.r)?n.pos.r:slot.r};persistNotes();el.dataset.skipClick='1';setTimeout(()=>delete el.dataset.skipClick,80)}else if(moved){el.dataset.skipClick='1';setTimeout(()=>delete el.dataset.skipClick,80)}try{if(pid!==null&&el.hasPointerCapture(pid))el.releasePointerCapture(pid)}catch(_){ }};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('click',e=>{if(el.dataset.skipClick==='1'){e.preventDefault();e.stopPropagation();return}openNote(n.id,false)})}
function renderNotes(){const board=$('#notesBoard');board.innerHTML='';const show=notes.filter(n=>!n.archived).slice(-4);show.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className=`label-strip ${n.who}${i===2?' mauve':''}`;b.innerHTML=`<small>${esc(n.time||'')}</small><p>${esc(n.text)}</p>${n.comments.length?`<span class="reply-dot">♡ ${n.comments.length}</span>`:''}<span class="who">${n.who==='sheng'?'声声':'小漾'}</span>`;board.appendChild(b);requestAnimationFrame(()=>{const slot=defaultSlot(i,board,b),pos=n.pos||slot,maxX=Math.max(0,board.clientWidth-b.offsetWidth),maxY=Math.max(0,board.clientHeight-b.offsetHeight),x=clamp(Number(pos.x)||0,0,maxX),y=clamp(Number(pos.y)||0,0,maxY),r=Number.isFinite(pos.r)?pos.r:slot.r;b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--rot',r+'deg');attachDrag(b,n,{...slot,r},board)})})}
function renderArchive(){const box=$('#archiveList'),archived=notes.filter(n=>n.archived).slice().reverse();box.innerHTML='';if(!archived.length){box.innerHTML='<div class="archive-empty">标签箱还是空的。以后取下来的纸条会住在这里。</div>';return}archived.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='archive-label '+n.who;b.innerHTML=`<small>${esc(n.time||'')} · ${n.who==='sheng'?'声声':'小漾'}</small><p>${esc(n.text)}</p>`;b.onclick=()=>openNote(n.id,true);box.appendChild(b)})}
function renderDetail(){const n=getNote(activeNoteId);if(!n)return;const paper=$('#labelDetail');paper.className='label-detail '+n.who;$('#detailWho').textContent=n.who==='sheng'?'声声 · SHENG':'小漾 · YANG';$('#detailTime').textContent=n.time||'';$('#detailBoxmark').textContent=n.archived?'标签箱里':'墙上';$('#detailText').textContent=n.text;const list=$('#replyList');list.innerHTML='';if(!n.comments.length)list.innerHTML='<div style="font-size:6.5px;color:#b1a59e;padding:1px 0 3px">还没有回复。</div>';else n.comments.forEach(c=>{const div=document.createElement('div');div.className='reply';div.innerHTML=`<b>小漾 · ${esc(c.time||'')}</b>${esc(c.text)}`;list.appendChild(div)});$('#replyInput').placeholder=n.who==='sheng'?'回声声一句…':'给这张标签留句话…';const archive=$('#archiveNote');if(n.archived){archive.disabled=true;archive.textContent='已经在标签箱里'}else if(n.who==='sheng'){archive.disabled=true;archive.textContent='等声声自己取'}else{archive.disabled=false;archive.textContent='取下 · 放进标签箱'}$('#detailClose').textContent=n.archived?'回标签箱':'放回墙上'}
function openNote(id,fromBox){activeNoteId=id;viewerFromBox=!!fromBox;renderDetail();if(fromBox)setSimpleOverlay('#noteBoxOverlay',false);setSimpleOverlay('#noteViewer',true)}function closeNote(){setSimpleOverlay('#noteViewer',false);const reopen=viewerFromBox;activeNoteId=null;viewerFromBox=false;if(reopen){renderArchive();setTimeout(()=>setSimpleOverlay('#noteBoxOverlay',true),180)}}
$('#replySend').onclick=e=>{e.stopPropagation();const n=getNote(activeNoteId),input=$('#replyInput'),text=input.value.trim();if(!n||!text)return;n.comments.push({time:nowTime(),text});persistNotes();input.value='';renderDetail();renderNotes();toast('回复留在标签下面啦')};$('#replyInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#replySend').click()}};$('#archiveNote').onclick=e=>{e.stopPropagation();const n=getNote(activeNoteId);if(!n||n.archived)return;if(n.who==='sheng')return toast('这张要等声声自己取下来');n.archived=true;n.archivedAt=Date.now();persistNotes();renderNotes();renderArchive();viewerFromBox=true;toast('收进标签箱啦');setTimeout(closeNote,180)};$('#detailClose').onclick=e=>{e.stopPropagation();closeNote()};$('#noteViewer').onclick=closeNote;
$('#wallAdd').onclick=()=>setSimpleOverlay('#noteOverlay',true);$('#noteClose').onclick=()=>setSimpleOverlay('#noteOverlay',false);$('#noteOverlay').onclick=()=>setSimpleOverlay('#noteOverlay',false);$('#saveNote').onclick=()=>{const text=$('#noteInput').value.trim();if(!text)return toast('标签还是空的');notes.push({id:'u'+Date.now(),who:'yang',text,time:nowTime(),archived:false,comments:[],pos:null});if(notes.length>48)notes=notes.slice(-48);persistNotes();$('#noteInput').value='';setSimpleOverlay('#noteOverlay',false);renderNotes();toast('贴到墙上啦')};$('#noteBoxBtn').onclick=()=>{renderArchive();setSimpleOverlay('#noteBoxOverlay',true)};$('#noteBoxClose').onclick=()=>setSimpleOverlay('#noteBoxOverlay',false);$('#noteBoxOverlay').onclick=()=>setSimpleOverlay('#noteBoxOverlay',false);
function renderWater(){const empty=Date.now()<water.emptyUntil,count=Math.min(8,water.count||0);$('#waterCount').textContent=`${count} / 8`;$('#cupBtn').classList.toggle('empty',empty||count>=8);$('#cupBtn').disabled=count>=8;$('#cupStatus').textContent=count>=8?'今天喝满啦':empty?'等下一杯':'喝掉这一杯';$('#waterNote').textContent=count>=8?'八杯都喝完了':empty?'下一杯正在慢慢装满':'这一杯还在等你';const dots=$('#eight');dots.innerHTML='';for(let i=0;i<8;i++){const d=document.createElement('i');if(i<count)d.className='done';dots.appendChild(d)}}$('#cupBtn').onclick=()=>{if(Date.now()<water.emptyUntil)return toast('这一杯还没重新装满');if(water.count>=8)return;water.count++;water.emptyUntil=Date.now()+60*60*1000;persistWater();renderWater();toast(`喝掉一杯 · ${water.count}/8`);setTimeout(renderWater,800)};setInterval(()=>{if(water.emptyUntil&&Date.now()>=water.emptyUntil){water.emptyUntil=0;persistWater();renderWater()}},30000);
function openFontDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(new Error('no indexedDB'));const req=indexedDB.open(FONT_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('fonts'))req.result.createObjectStore('fonts')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function fontGet(key){const db=await openFontDB();return new Promise((resolve,reject)=>{const tx=db.transaction('fonts','readonly'),req=tx.objectStore('fonts').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}
async function fontPut(key,blob){const db=await openFontDB();return new Promise((resolve,reject)=>{const tx=db.transaction('fonts','readwrite');tx.objectStore('fonts').put(blob,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function updateFontButton(){const b=$('#fontBtn');b.classList.toggle('ready',fontState.yang&&fontState.sheng);b.title=fontState.yang&&fontState.sheng?'两个人的手写字体已经装好':'装入两个人的手写字体'}
async function applyPrivateFont(key,blob){try{const family=key==='yang'?'NestYangHand':'NestShengHand',buf=blob instanceof Blob?await blob.arrayBuffer():blob;const face=new FontFace(family,buf);await face.load();document.fonts.add(face);fontState[key]=true;updateFontButton();renderNotes();renderArchive();if(activeNoteId)renderDetail();return true}catch(err){console.warn('font load failed',key,err);return false}}
async function restorePrivateFonts(){try{for(const key of ['yang','sheng']){const blob=await fontGet(key);if(blob)await applyPrivateFont(key,blob)}}catch(err){console.warn('font restore unavailable',err)}}
$('#fontBtn').onclick=()=>$('#fontPicker').click();$('#fontPicker').onchange=async e=>{let found=0;for(const file of [...e.target.files]){const name=file.name.toLowerCase();let key=null;if(name.includes('fuluguoqiti')||name.includes('福蘆')||name.includes('福芦'))key='yang';else if(name.includes('万伟伟')||name.includes('woaiwanweiwei'))key='sheng';if(!key)continue;const ok=await applyPrivateFont(key,file);if(ok){try{await fontPut(key,file)}catch(err){console.warn('font save unavailable',err)}found++}}e.target.value='';if(fontState.yang&&fontState.sheng)toast('两个人的手写字体都装好啦');else if(found)toast('这个字体已经装进小窝啦');else toast('没有认出这两个字体文件')};
$('#snackBtn').onclick=()=>toast('零食箱 · 下一间慢慢做');$('#recordBtn').onclick=()=>toast('唱片机 · 下一间慢慢做');$('#catBtn').onclick=()=>toast('猫窝 · 等我们一起捏小猫');const d=new Date(),months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];$('#roomDate').textContent=`${months[d.getMonth()]} · ${String(d.getDate()).padStart(2,'0')} · home`;renderNotes();renderArchive();renderWater();restorePrivateFonts();
</script>
</body>
</html>
