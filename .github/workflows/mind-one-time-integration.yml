name: One-time Mind integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mind-one-time-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow changes to the exact reviewed files
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          expected = {
              'index.html': 'c30847c8947e91c7b65a433f8cf7c6f6d29778c7',
              'styles/cron-sheet.css': '100c044c2464ed5da472003b02dfdb3c56d5e6b9',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'{path} changed concurrently; refusing to overwrite')
          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          text = source
          def replace_once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old[:70]!r}')
              text = text.replace(old, new, 1)
          replace_once('<link rel="stylesheet" href="styles/cron-sheet.css?v=20260907-1"/>', '<link rel="stylesheet" href="styles/cron-sheet.css?v=20260907-2"/>\n<link rel="stylesheet" href="styles/mind-sheet.css?v=20260907-1"/>')
          start = '<nav class="drawer-list" aria-label="侧边栏导航">'
          end = '</nav>'
          if text.count(start) != 1:
              raise SystemExit('Drawer navigation not unique')
          before, tail = text.split(start, 1)
          navigation, after = tail.split(end, 1)
          cron_line = next(line for line in navigation.splitlines() if 'data-route="cron"' in line)
          if navigation.count('data-route="cron"') != 1 or 'data-route="mind"' in navigation:
              raise SystemExit('Unexpected drawer state')
          mind_line = '<button class="drawer-link" data-route="mind"><span class="drawer-index">02</span><span class="drawer-label">mind</span><span class="drawer-line"></span><span class="drawer-en">his thoughts</span></button>'
          navigation = navigation.replace(cron_line, cron_line + '\n' + mind_line, 1)
          indices = iter(range(1, 8))
          navigation, count = re.subn(r'(<span class="drawer-index">)\d+(</span>)', lambda m: m.group(1) + f'{next(indices):02d}' + m.group(2), navigation)
          if count != 7:
              raise SystemExit('Unexpected drawer item count')
          text = before + start + navigation + end + after
          replace_once('<script src="cron-sheet.js?v=20260907-1"></script>', '<script src="cron-sheet.js?v=20260907-1"></script>\n<script src="mind-sheet.js?v=20260907-1"></script>')
          assert source.count('<section class="messages" id="messages">') == 1
          assert source.count('<div class="todo-sheet-layer" id="todoSheetLayer"') == 1
          assert text.count('data-route="mind"') == 1
          path.write_text(text, encoding='utf-8')
          css = Path('styles/cron-sheet.css')
          original_css = css.read_text(encoding='utf-8')
          css.write_text(original_css + '\n/* The focused dialog itself must not receive the browser blue ring. */\n.cron-sheet:focus{outline:none!important}\n', encoding='utf-8')
          print('PASS: existing Chat and Todo markup preserved; Mind entry and assets inserted; Cron dialog focus ring removed.')
          PY
      - name: Check JavaScript and integration
        run: |
          node --check mind-sheet.js
          node --check cron-sheet.js
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          assert s.count('mind-sheet.js?v=20260907-1') == 1
          assert s.count('styles/mind-sheet.css?v=20260907-1') == 1
          assert s.count('styles/cron-sheet.css?v=20260907-2') == 1
          assert s.index('data-route="cron"') < s.index('data-route="mind"') < s.index('data-route="回忆"')
          print('PASS: Mind route and all required assets present.')
          PY
      - name: Commit only the two reviewed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles/cron-sheet.css
          git commit -m "Add Mind sidebar entry and remove Cron dialog focus ring"
          git push origin HEAD:main
