name: One-time Cron integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cron-one-time-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original markup and insert only Cron assets
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          expected = '5a8b867bed7c53da44b082c09a560da5881380b3'
          actual = subprocess.check_output(['git','hash-object','index.html'], text=True).strip()
          if actual != expected:
              raise SystemExit('index.html changed concurrently; refusing to overwrite')
          original = subprocess.check_output(['git','show','22eab4a5e82036741cf7889e756f6e8b267d919b:index.html'])
          content = original.decode('utf-8')
          assert content.count('</head>') == 1 and content.count('</body>') == 1
          content = content.replace('</head>', '<link rel="stylesheet" href="styles/cron-sheet.css?v=20260907-1"/>\n</head>', 1)
          content = content.replace('</body>', '<script src="cron-sheet.js?v=20260907-1"></script>\n</body>', 1)
          Path('index.html').write_bytes(content.encode('utf-8'))
          assert content.replace('<link rel="stylesheet" href="styles/cron-sheet.css?v=20260907-1"/>\n', '', 1).replace('<script src="cron-sheet.js?v=20260907-1"></script>\n', '', 1).encode('utf-8') == original
          print('Exact-source integration verified: original markup plus two asset references.')
          PY
      - name: Verify JavaScript syntax
        run: node --check cron-sheet.js
      - name: Commit only the restored index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate Cron without altering existing Chat markup"
          git push origin HEAD:main