name: Chat feedback repair
on:
  push:
    branches: [fix/chat-special-feedback-20260909]
    paths:
      - '.github/workflows/chat-feedback-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-source repairs
        run: python3 scripts/repair-chat-feedback.py
      - name: Check JavaScript syntax
        run: |
          node --check chat-special-v2-core.js
          node --check chat-special-v2-music.js
          node --check chat-special-v2-timer.js
          node --check chat-special-v2-boot.js
      - name: Install browser runner
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install chromium
      - name: Run focused browser regression
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/chat-feedback-server.log 2>&1 &
          sleep 2
          npx playwright test tests/chat-feedback.spec.cjs --workers=1 --reporter=line --timeout=30000
      - name: Commit verified changes to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html chat-special-v2-core.js chat-special-v2-music.js chat-special-v2-timer.js
          git diff --cached --check
          git commit -m "Restore original Chat shell, fix countdown expiry and image fallbacks"
          git push origin HEAD:fix/chat-special-feedback-20260909
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chat-feedback-failures
          path: test-results/
          if-no-files-found: ignore
