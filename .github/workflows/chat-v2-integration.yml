name: One-time Chat v2 integration
on:
  push:
    branches: [preview/chat-special-v2]
    paths: ['.github/workflows/chat-v2-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded source integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/chat-v2-integrate.py').read_text(encoding='utf-8')
          a=source.index('def change(')
          b=source.index('def section(',a)
          helper='''def change(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count == 0 and new in s:
                  return
              if count not in (1, 2) or (count == 2 and 'panel.style.maxHeight=' not in old):
                  raise SystemExit(f'Unexpected source match in {path}: {old[:100]}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          '''
          source=source[:a]+helper+source[b:]
          exec(compile(source,'scripts/chat-v2-integrate.py','exec'),{'__name__':'__main__'})
          PY
      - name: Check JavaScript and scoped integration
        run: |
          node --check chat-special-v2-core.js
          node --check chat-special-v2-music.js
          node --check chat-special-v2-timer.js
          node --check chat-special-v2-boot.js
          node --check app.js
          node --check cron-sheet.js
          node --check mind-sheet.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('chat-special-v2-core.js')==1
          assert s.count('chat-rich.js?v=20260907-3')==0
          for path in ['chat-special-v2-core.js','chat-special-v2-music.js','chat-special-v2-timer.js','chat-special-v2-boot.js','styles/chat-special-v2.css']:
              assert Path(path).exists(),path
          print('PASS: all JavaScript parses and the new runtime replaces only the old rich-chat loader.')
          PY
      - name: Commit integrated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html chat-special-v2-core.js chat-special-v2-music.js chat-special-v2-timer.js chat-special-v2-boot.js styles/chat-special-v2.css
          git commit -m "Load Chat v2 attachments and correct interaction state"
          git push origin HEAD:preview/chat-special-v2
