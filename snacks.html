<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbefe8">
<title>潮生 · 零食架</title>
<style>
:root{--ink:#6b5b55;--soft:#a59087;--pink:#e8b9bf;--milk:#fffaf5;--line:rgba(125,93,82,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button,input{font:inherit;color:inherit}button{cursor:pointer}
body{overflow:hidden;background:#f7e8df}.page{width:100%;max-width:520px;height:100dvh;margin:auto;position:relative;overflow:hidden;background-image:linear-gradient(rgba(255,246,239,.72),rgba(255,246,239,.84)),url('assets/snack-room-bg.jpg');background-size:cover;background-position:center}.scroll{height:100%;overflow:auto;padding:calc(env(safe-area-inset-top) + 58px) 14px calc(env(safe-area-inset-bottom) + 104px);scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.back{position:absolute;z-index:20;left:14px;top:calc(env(safe-area-inset-top) + 10px);width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,250,246,.80);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(110,80,69,.06);display:grid;place-items:center}.back svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.back:active{transform:scale(.94)}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 3px 13px}.title{font-size:21px;font-weight:730;letter-spacing:.02em}.sub{font-size:11px;color:#a08f88;margin-top:4px}.today{padding:7px 10px;border-radius:999px;background:rgba(255,250,246,.72);font-size:10px;color:#9d777c;box-shadow:0 4px 13px rgba(111,82,72,.04)}
.quick-wrap{margin:0 0 13px;padding:11px 11px 10px;border:1px solid rgba(125,93,82,.06);border-radius:18px 7px 18px 18px;background:rgba(255,250,246,.66);backdrop-filter:blur(3px)}.quick-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.quick-head b{font-size:11px}.quick-head span{font-size:9px;color:#ac9991}.quick{display:flex;gap:7px;overflow:auto;padding-bottom:1px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{height:34px;border:0;border-radius:11px 5px 11px 11px;padding:0 11px;background:#fff5ef;white-space:nowrap;font-size:10px;box-shadow:0 4px 10px rgba(109,76,66,.04)}.quick button:active{transform:scale(.96)}.quick-empty{font-size:10px;color:#aa9992;padding:4px 1px 2px}
.shelf-head{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 10px}.shelf-head b{font-size:12px}.shelf-head span{font-size:10px;color:#a18f87}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:8px;row-gap:16px;align-items:start}.card{min-width:0;min-height:119px;border:0;border-radius:0;background:transparent;padding:3px 1px 0;position:relative;overflow:visible;box-shadow:none;transition:transform .18s,opacity .24s}.card::before{content:"";position:absolute;left:5px;right:5px;top:75px;height:1px;background:rgba(194,154,144,.16);box-shadow:0 2px 0 rgba(255,255,255,.28);pointer-events:none}.card:active{transform:scale(.97)}.card.poof{transform:scale(.72) rotate(-4deg);opacity:0}.pic{height:72px;display:grid;place-items:center;position:relative;padding:6px 5px 4px}.pic img{display:block;width:auto;height:auto;max-width:62px;max-height:62px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(95,69,61,.07))}.text-pic{width:58px;height:58px;border-radius:15px 6px 15px 15px;background:rgba(247,224,217,.46);border:1px dashed rgba(184,137,126,.19);display:grid;place-items:center;padding:7px;text-align:center;font-size:10px;font-weight:700;line-height:1.25;color:#8d7067}.qty{position:absolute;right:-1px;top:-2px;z-index:4;min-width:25px;height:20px;padding:0 6px;border-radius:999px;background:rgba(238,194,199,.90);display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#795c62;box-shadow:0 2px 6px rgba(114,77,83,.06)}.name{margin-top:7px;padding:0 2px;text-align:center;font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eat{display:block;width:calc(100% - 8px);height:24px;margin:5px auto 0;border:0;border-radius:9px 4px 9px 9px;background:rgba(239,202,202,.48);font-size:8.5px;color:#8a6667}.eat:active{transform:scale(.95)}.star{position:absolute;left:0;top:-1px;z-index:5;width:20px;height:20px;display:grid;place-items:center;font-size:11px;color:#cf9da4;text-shadow:0 1px 2px rgba(255,255,255,.65)}.empty{grid-column:1/-1;margin-top:10px;padding:54px 20px;text-align:center;border-radius:24px 8px 24px 24px;background:rgba(255,252,248,.46);border:1px dashed rgba(159,120,107,.12);font-size:12px;line-height:1.8;color:#9e8b83}.empty i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}
.add{position:absolute;z-index:25;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);height:47px;padding:0 18px;border:0;border-radius:17px 7px 17px 17px;background:rgba(238,193,199,.94);color:#76575d;font-weight:700;font-size:12px;box-shadow:0 8px 25px rgba(114,77,83,.14);backdrop-filter:blur(6px)}.add:active{transform:translateX(-50%) scale(.96)}
.overlay{position:fixed;z-index:60;inset:0;background:rgba(72,57,52,0);opacity:0;pointer-events:none;backdrop-filter:blur(0);transition:.28s}.overlay.show{opacity:1;pointer-events:auto;background:rgba(72,57,52,.16);backdrop-filter:blur(7px)}.sheet{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:#fffaf5;border-radius:22px 8px 22px 22px;padding:15px;box-shadow:0 20px 45px rgba(78,58,51,.13);transform:translateY(22px) scale(.97);opacity:0;transition:.34s cubic-bezier(.2,.85,.2,1)}.overlay.show .sheet{transform:none;opacity:1}.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet-top strong{font-size:14px}.close{width:29px;height:29px;border:0;border-radius:10px;background:#f7e9e3}.field{margin-top:10px}.field label{display:block;font-size:10px;color:#9d8981;margin:0 0 5px 2px}.field input[type=text],.field input[type=number]{width:100%;height:43px;border:0;outline:none;border-radius:13px 5px 13px 13px;background:#f9efea;padding:0 12px;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.upload{height:43px;border:1px dashed rgba(171,128,115,.20);border-radius:13px 5px 13px 13px;background:#fff6f0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#917870;overflow:hidden;position:relative}.upload img{width:100%;height:100%;object-fit:contain}.quick-check{margin-top:11px;display:flex;align-items:center;gap:8px;font-size:11px}.quick-check input{width:17px;height:17px;accent-color:#dda9b0}.save{width:100%;height:44px;margin-top:14px;border:0;border-radius:14px 5px 14px 14px;background:#edc4c6;font-size:12px;font-weight:700}.detail-main{text-align:center}.detail-pic{height:122px;display:grid;place-items:center;margin-top:-2px}.detail-pic img{display:block;max-height:110px;max-width:110px;width:auto;height:auto;object-fit:contain}.detail-text-pic{margin:auto}.detail-name{font-size:16px;font-weight:750}.detail-count{font-size:11px;color:#9e8982;margin-top:4px}.actions{display:grid;grid-template-columns:1.25fr .75fr;gap:8px;margin-top:13px}.actions button{height:43px;border:0;border-radius:13px 5px 13px 13px;font-size:11px}.eat-big{background:#edc3c6;font-weight:700}.plus{background:#f7eae3}.minor{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.minor button{height:37px;border:0;border-radius:11px 4px 11px 11px;background:#faf0eb;font-size:10px;color:#947d74}.remove{color:#b08080!important}.toast{position:fixed;z-index:90;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translate(-50%,8px);padding:8px 11px;border-radius:11px;background:rgba(66,53,49,.86);color:#fff;font-size:10px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:470px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));column-gap:10px}.pic img{max-width:66px;max-height:66px}}
@media(max-width:340px){.grid{column-gap:5px;row-gap:14px}.pic{height:68px}.pic img{max-width:56px;max-height:56px}.card::before{top:71px}.text-pic{width:53px;height:53px;font-size:9px}.name{font-size:8.8px}.eat{font-size:8px}}
</style>
</head>
<body>
<main class="page">
<button class="back" type="button" onclick="location.href='nest.html'" aria-label="回小窝"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<section class="scroll"><div class="top"><div><div class="title">零食架</div><div class="sub" id="lastEat">想吃什么就拿一份。</div></div><div class="today" id="todayEat">今天吃掉 0 个</div></div><section class="quick-wrap"><div class="quick-head"><b>常拿的</b><span>点一下就补 1 个</span></div><div class="quick" id="quick"></div></section><div class="shelf-head"><b>架子上</b><span id="total">0 种 · 0 个</span></div><section class="grid" id="grid"></section></section>
<button class="add" id="addBtn" type="button">＋ 放进零食</button>
<div class="overlay" id="addOverlay"><section class="sheet" onclick="event.stopPropagation()"><div class="sheet-top"><strong>放进零食架</strong><button class="close" id="addClose">×</button></div><div class="field"><label>零食名字</label><input id="nameInput" type="text" maxlength="24" placeholder="比如：草莓夹心饼干"></div><div class="row"><div class="field"><label>数量</label><input id="countInput" type="number" min="1" max="99" value="1"></div><div class="field"><label>PNG / 图片</label><button class="upload" id="uploadBtn" type="button"><span id="uploadText">上传图片</span><img id="uploadPreview" hidden></button><input id="imageInput" type="file" accept="image/png,image/webp,image/jpeg" hidden></div></div><label class="quick-check"><input id="quickCheck" type="checkbox">放到「常拿的」快捷栏</label><button class="save" id="saveBtn" type="button">放进去</button></section></div>
<div class="overlay" id="detailOverlay"><section class="sheet" onclick="event.stopPropagation()"><div class="sheet-top"><strong>这份零食</strong><button class="close" id="detailClose">×</button></div><div class="detail-main"><div class="detail-pic" id="detailPic"></div><div class="detail-name" id="detailName"></div><div class="detail-count" id="detailCount"></div></div><div class="actions"><button class="eat-big" id="eatBig">吃掉一个</button><button class="plus" id="plusOne">＋ 1</button></div><div class="minor"><button id="toggleQuick">设为快捷</button><button id="replaceImg">换图片</button><button class="remove" id="removeItem">移出零食架</button><button id="cancelDetail">放回去</button></div><input id="replaceInput" type="file" accept="image/png,image/webp,image/jpeg" hidden></section></div>
<div class="toast" id="toast"></div>
</main>
<script>
const $=s=>document.querySelector(s),STORE='chaosheng-snacks-v1',EVENTS='chaosheng-snack-events-v1';let items=(()=>{try{const v=JSON.parse(localStorage.getItem(STORE));return Array.isArray(v)?v:[]}catch(e){return[]}})(),events=(()=>{try{const v=JSON.parse(localStorage.getItem(EVENTS));return Array.isArray(v)?v:[]}catch(e){return[]}})(),selected=null,pendingImg='';
function save(){localStorage.setItem(STORE,JSON.stringify(items))}function saveEvents(){localStorage.setItem(EVENTS,JSON.stringify(events.slice(-300)))}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]))}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1200)}function dayKey(ts=Date.now()){const d=new Date(ts);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}function fmtTime(ts){const d=new Date(ts);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function openOv(id,on){$(id).classList.toggle('show',on)}
function makePic(item,detail=false){if(item.img)return `<img src="${item.img}" alt="">`;return `<div class="text-pic${detail?' detail-text-pic':''}">${esc(item.name)}</div>`}
function render(){const grid=$('#grid');grid.innerHTML='';let total=0;items.forEach(x=>total+=x.count);$('#total').textContent=`${items.length} 种 · ${total} 个`;if(!items.length)grid.innerHTML='<div class="empty"><i>♡</i>零食架还是空的。<br>买到喜欢的就放进来吧。</div>';else items.forEach(item=>{const c=document.createElement('article');c.className='card';c.dataset.id=item.id;c.innerHTML=`${item.quick?'<span class="star">★</span>':''}<div class="pic">${makePic(item)}<span class="qty">× ${item.count}</span></div><div class="name">${esc(item.name)}</div><button class="eat" type="button">吃掉 1 个</button>`;c.onclick=e=>{if(e.target.closest('.eat'))return;openDetail(item.id)};c.querySelector('.eat').onclick=e=>{e.stopPropagation();eat(item.id,c)};grid.appendChild(c)});renderQuick();renderStats()}
function renderQuick(){const q=$('#quick'),list=items.filter(x=>x.quick);q.innerHTML='';if(!list.length){q.innerHTML='<div class="quick-empty">给常吃的零食点个 ★，它就会住在这里。</div>';return}list.forEach(item=>{const b=document.createElement('button');b.textContent=`＋ ${item.name}`;b.onclick=()=>{item.count=Math.min(99,item.count+1);item.updatedAt=Date.now();save();render();toast(`${item.name} ＋1`)};q.appendChild(b)})}
function renderStats(){const today=events.filter(e=>dayKey(e.at)===dayKey()).length;$('#todayEat').textContent=`今天吃掉 ${today} 个`;const last=events[events.length-1];$('#lastEat').textContent=last?`上次 ${fmtTime(last.at)} · ${last.name}`:'想吃什么就拿一份。'}
function eat(id,card){const item=items.find(x=>x.id===id);if(!item)return;item.count--;events.push({at:Date.now(),name:item.name,id:item.id});saveEvents();if(item.count<=0){if(card)card.classList.add('poof');setTimeout(()=>{items=items.filter(x=>x.id!==id);save();selected=null;openOv('#detailOverlay',false);render();toast(`${item.name} 吃完啦`)} ,220)}else{save();render();if(selected===id)fillDetail(item);toast(`${item.name} × ${item.count}`)}}
function openDetail(id){const item=items.find(x=>x.id===id);if(!item)return;selected=id;fillDetail(item);openOv('#detailOverlay',true)}function fillDetail(item){$('#detailPic').innerHTML=makePic(item,true);$('#detailName').textContent=item.name;$('#detailCount').textContent=`还剩 ${item.count} 个`;$('#toggleQuick').textContent=item.quick?'取消快捷':'设为快捷'}
function closeDetail(){openOv('#detailOverlay',false);selected=null}
async function imageToSmall(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onload=()=>{const max=420,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let out;try{out=c.toDataURL('image/webp',.88)}catch(e){out=c.toDataURL('image/png')}resolve(out)};im.onerror=reject;im.src=r.result};r.readAsDataURL(file)})}
$('#addBtn').onclick=()=>{pendingImg='';$('#nameInput').value='';$('#countInput').value='1';$('#quickCheck').checked=false;$('#uploadPreview').hidden=true;$('#uploadText').hidden=false;openOv('#addOverlay',true)};$('#addClose').onclick=()=>openOv('#addOverlay',false);$('#addOverlay').onclick=()=>openOv('#addOverlay',false);$('#uploadBtn').onclick=()=>$('#imageInput').click();$('#imageInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{pendingImg=await imageToSmall(f);$('#uploadPreview').src=pendingImg;$('#uploadPreview').hidden=false;$('#uploadText').hidden=true}catch(_){toast('这张图片没有读成功')}e.target.value=''};
$('#saveBtn').onclick=()=>{const name=$('#nameInput').value.trim(),count=Math.max(1,Math.min(99,Number($('#countInput').value)||1));if(!name)return toast('先写零食名字');const old=items.find(x=>x.name.toLowerCase()===name.toLowerCase());if(old){old.count=Math.min(99,old.count+count);if(pendingImg)old.img=pendingImg;if($('#quickCheck').checked)old.quick=true;old.updatedAt=Date.now()}else items.push({id:'s'+Date.now(),name,count,img:pendingImg||'',quick:$('#quickCheck').checked,createdAt:Date.now(),updatedAt:Date.now()});save();openOv('#addOverlay',false);render();toast('放进零食架啦')};
$('#detailClose').onclick=closeDetail;$('#cancelDetail').onclick=closeDetail;$('#detailOverlay').onclick=closeDetail;$('#eatBig').onclick=()=>selected&&eat(selected,$(`.card[data-id="${selected}"]`));$('#plusOne').onclick=()=>{const x=items.find(i=>i.id===selected);if(!x)return;x.count=Math.min(99,x.count+1);save();render();fillDetail(x);toast('补了 1 个')};$('#toggleQuick').onclick=()=>{const x=items.find(i=>i.id===selected);if(!x)return;x.quick=!x.quick;save();render();fillDetail(x);toast(x.quick?'放到快捷栏啦':'从快捷栏拿下来啦')};$('#replaceImg').onclick=()=>$('#replaceInput').click();$('#replaceInput').onchange=async e=>{const f=e.target.files[0],x=items.find(i=>i.id===selected);if(!f||!x)return;try{x.img=await imageToSmall(f);save();render();fillDetail(x);toast('图片换好啦')}catch(_){toast('这张图片没有读成功')}e.target.value=''};$('#removeItem').onclick=()=>{const x=items.find(i=>i.id===selected);if(!x)return;items=items.filter(i=>i.id!==selected);save();closeDetail();render();toast(`${x.name} 移出零食架`)};render();
</script>
</body>
</html>
