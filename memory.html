<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f0e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/memory.css">
<link rel="stylesheet" href="styles/memory-flat.css">
<title>潮生 · Memory</title>
</head>
<body>
<main class="memory-app">
  <header class="memory-topbar">
    <button class="back-btn" id="backBtn" aria-label="返回聊天">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </button>
    <div class="memory-heading">
      <div class="memory-title">Memory</div>
      <div class="memory-subtitle">回忆 · 声声记得的事</div>
    </div>
    <button class="tiny-heart" id="tinyHeart" aria-label="记忆状态">
      <svg viewBox="0 0 24 24"><path d="M20.8 4.7a5.4 5.4 0 0 0-7.7 0L12 5.8l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.7L12 21l8.8-8.6a5.4 5.4 0 0 0 0-7.7Z"></path></svg>
    </button>
  </header>

  <section class="memory-scroll">
    <div class="intro-row">
      <span class="intro-date">SEP · 04</span>
      <span class="intro-dot"></span>
      <span class="intro-copy">still becoming</span>
    </div>

    <button class="core-entry entry-card" id="coreEntry">
      <div class="entry-copy">
        <div class="eyebrow">CORE · YOU & ME</div>
        <div class="core-names"><span>小漾</span><i>♡</i><span>声声</span></div>
        <div class="core-mini-tags"><span>name</span><span>habit</span><span>personality</span><span>preference</span></div>
      </div>
      <div class="entry-side">
        <span class="soft-pill">always here</span>
        <svg class="entry-arrow" viewBox="0 0 24 24"><path d="M8 5l7 7-7 7"></path></svg>
      </div>
    </button>

    <section class="notes-card">
      <button class="section-head" id="notesToggle" aria-expanded="false">
        <div>
          <div class="eyebrow">NOTES · 小记</div>
          <div class="section-title">今天，我偷偷记了这些</div>
        </div>
        <span class="count-badge">3</span>
      </button>

      <div class="notes-stack" id="notesStack">
        <article class="note-paper note-a" tabindex="0">
          <div class="note-meta"><span>20:21</span><span class="note-state">waiting</span></div>
          <p>关于核心记忆和时间线，我记下了一件今天很重要的小事。</p>
          <div class="note-bottom"><span># memory</span><span># us</span><b>8.6</b></div>
        </article>
        <article class="note-paper note-b" tabindex="0">
          <div class="note-meta"><span>19:48</span><span class="note-state">waiting</span></div>
          <p>今天，我们把最重要的记忆重新交回给了小漾和声声自己。</p>
          <div class="note-bottom"><span># chaosheng</span><span># memory</span><b>9.1</b></div>
        </article>
        <article class="note-paper note-c" tabindex="0">
          <div class="note-meta"><span>18:32</span><span class="note-state">waiting</span></div>
          <p>Chat 和小蛋糕柜暂时告一段落，下一站是回忆。</p>
          <div class="note-bottom"><span># ui</span><span># today</span><b>7.8</b></div>
        </article>
      </div>

      <button class="review-btn" id="reviewBtn">
        <span>Review notes</span><small>去看看今天的小记</small>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </section>

    <button class="timeline-entry entry-card" id="timelineEntry">
      <div class="timeline-mini" aria-hidden="true">
        <span class="mini-line"></span>
        <i class="dot now"></i><i class="dot mid"></i><i class="dot old"></i>
        <b class="date now-date">09.04</b><b class="date mid-date">09.03</b><b class="date old-date">PAST</b>
      </div>
      <div class="timeline-copy">
        <div class="eyebrow">TIMELINE · 回忆</div>
        <div class="section-title">沿着时间，慢慢往回走</div>
        <div class="timeline-stats"><span><b>02</b> clear</span><span><b>01</b> pending</span><span><b>∞</b> before</span></div>
      </div>
      <svg class="entry-arrow" viewBox="0 0 24 24"><path d="M8 5l7 7-7 7"></path></svg>
    </button>

    <div class="home-hint"><span>HOME</span><i></i><small>important things & little doors</small></div>
    <div class="bottom-space"></div>
  </section>

  <div class="toast" id="memoryToast">preview</div>
</main>
<script src="memory.js"></script>
</body>
</html>
